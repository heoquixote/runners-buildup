name: CI

# PR 단계에서 배포 전과 같은 검사를 돌린다.
# main 에 머지된 뒤의 배포는 pages.yml 이 맡는다.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - run: pip install numpy scipy scikit-learn pandas matplotlib seaborn statsmodels
      # 모든 문제의 모범답안이 채점을 통과하고, 시작 코드는 통과하지 않는지 확인
      - run: npm run verify

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files (pages.yml 과 같은 방식)
        run: |
          mkdir _site
          cp index.html styles.css harness.py .nojekyll *.js _site/
          cp -r assets content datasets _site/
      - name: Check local imports
        run: |
          # _site 안의 모든 .js 가 import 하는 ./ 상대 경로 모듈이 실제로 있는지 확인한다
          missing=0
          for f in $(find _site -name '*.js' -not -path '_site/datasets/*'); do
            dir=$(dirname "$f")
            for m in $(grep -oE "(from|import\() *[\"']\.{1,2}/[^\"']+[\"']" "$f" | grep -oE "\.{1,2}/[^\"']+"); do
              test -f "$dir/$m" || { echo "missing module: $m (imported by ${f#_site/})"; missing=1; }
            done
          done
          exit $missing
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 3
