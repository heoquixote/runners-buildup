name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy scikit-learn pandas matplotlib seaborn
      - run: node scripts/verify.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          # 루트의 모든 .js 를 복사한다 (새 모듈을 추가해도 목록 누락으로 404 나지 않도록)
          cp index.html styles.css harness.py .nojekyll *.js _site/
          cp -r assets content datasets _site/
          # app.js 가 import 하는 로컬 모듈이 모두 _site 에 있는지 확인
          for m in $(grep -oE 'from "\./[^"]+"' app.js | sed -E 's/from "\.\/(.*)"/\1/'); do
            test -f "_site/$m" || { echo "missing module: $m"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
