<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 280" width="788" height="280" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>Git 에 올리는 파일과 .gitignore 로 빼는 파일</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="14" y="14" width="370" height="230" rx="12" fill="#121516" fill-opacity="1" stroke="#61db9c" stroke-width="1.5"/><text x="199" y="38.0" font-size="14" fill="#61db9c" text-anchor="middle" dominant-baseline="central" font-weight="700">Git 에 올린다 (공유)</text><text x="34" y="72.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">app.py · *.ipynb</text><text x="220" y="72.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">내 코드</text><text x="34" y="112.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">requirements.txt</text><text x="220" y="112.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">설치 목록 (몇 줄)</text><text x="34" y="152.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">.gitignore</text><text x="220" y="152.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">올리지 않을 목록</text><text x="34" y="192.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">README.md</text><text x="220" y="192.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">실행 방법 안내</text><rect x="400" y="14" width="374" height="230" rx="12" fill="#121516" fill-opacity="1" stroke="#ff7a92" stroke-width="1.5"/><text x="587" y="38.0" font-size="14" fill="#ff7a92" text-anchor="middle" dominant-baseline="central" font-weight="700">.gitignore 로 뺀다 (각자 PC 에만)</text><text x="420" y="72.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">venv/</text><text x="600" y="72.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">수백 MB, 운영체제마다 다름</text><text x="420" y="112.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">__pycache__/</text><text x="600" y="112.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">파이썬이 만드는 임시 파일</text><text x="420" y="152.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">.ipynb_checkpoints/</text><text x="600" y="152.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">노트북 자동 저장본</text><text x="420" y="192.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">.env</text><text x="600" y="192.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">비밀번호 · API 키</text><text x="394" y="262.0" font-size="12.5" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">venv 는 requirements.txt 만 있으면 누구나 다시 만들 수 있다</text></svg>