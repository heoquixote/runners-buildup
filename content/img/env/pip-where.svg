<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 270" width="788" height="270" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>pip 명령을 치는 곳: 터미널은 그대로, 파이썬 &gt;&gt;&gt; 에서는 에러, 노트북 셀은 % 를 붙인다</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="16" y="16" width="236" height="170" rx="10" fill="#121516" fill-opacity="1" stroke="#61db9c" stroke-width="1.4"/><rect x="16" y="16" width="236" height="28" rx="10" fill="#1d2223" fill-opacity="1" stroke="#61db9c" stroke-width="1.4"/><rect x="17" y="34" width="234" height="10" rx="0" fill="#1d2223" fill-opacity="1" stroke="#1d2223" stroke-width="0"/><circle cx="32.0" cy="30.0" r="4" fill="#ff7a92" fill-opacity="0.8" stroke="none" stroke-width="1.5"/><circle cx="46.0" cy="30.0" r="4" fill="#ffcf4a" fill-opacity="0.8" stroke="none" stroke-width="1.5"/><circle cx="60.0" cy="30.0" r="4" fill="#61db9c" fill-opacity="0.8" stroke="none" stroke-width="1.5"/><text x="78" y="30.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="600">터미널 (명령 프롬프트)</text><text x="30" y="58.5" font-size="11.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">Windows: cmd · PowerShell</text><text x="30" y="73.5" font-size="11.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">macOS: 터미널 · VS Code 터미널</text><text x="30" y="116.0" font-size="12" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">C:\&gt; pip install pandas</text><text x="30" y="142.0" font-size="12" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">$ pip install pandas</text><rect x="16" y="198" width="236" height="58" rx="8" fill="#61db9c" fill-opacity="0.1" stroke="#61db9c" stroke-width="1.4"/><text x="134" y="227.0" font-size="12.5" fill="#61db9c" text-anchor="middle" dominant-baseline="central" font-weight="600">pip 명령은 여기에</text><rect x="268" y="16" width="236" height="170" rx="10" fill="#121516" fill-opacity="1" stroke="#ff7a92" stroke-width="1.4"/><rect x="268" y="16" width="236" height="28" rx="10" fill="#1d2223" fill-opacity="1" stroke="#ff7a92" stroke-width="1.4"/><rect x="269" y="34" width="234" height="10" rx="0" fill="#1d2223" fill-opacity="1" stroke="#1d2223" stroke-width="0"/><circle cx="284.0" cy="30.0" r="4" fill="#ff7a92" fill-opacity="0.8" stroke="none" stroke-width="1.5"/><circle cx="298.0" cy="30.0" r="4" fill="#ffcf4a" fill-opacity="0.8" stroke="none" stroke-width="1.5"/><circle cx="312.0" cy="30.0" r="4" fill="#61db9c" fill-opacity="0.8" stroke="none" stroke-width="1.5"/><text x="330" y="30.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="600">파이썬 대화형 (&gt;&gt;&gt;)</text><text x="282" y="66.0" font-size="11.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">터미널에서 python 을 치면 들어감</text><text x="282" y="116.0" font-size="12" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">&gt;&gt;&gt; pip install pandas</text><text x="282" y="142.0" font-size="12" fill="#ff7a92" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">SyntaxError</text><rect x="268" y="198" width="236" height="58" rx="8" fill="#ff7a92" fill-opacity="0.1" stroke="#ff7a92" stroke-width="1.4"/><text x="386" y="218.9" font-size="12.5" fill="#ff7a92" text-anchor="middle" dominant-baseline="central" font-weight="600">여기에 치면 에러.</text><text x="386" y="235.1" font-size="12.5" fill="#ff7a92" text-anchor="middle" dominant-baseline="central" font-weight="600">exit() 로 나와서 터미널로</text><rect x="520" y="16" width="236" height="170" rx="10" fill="#121516" fill-opacity="1" stroke="#ffcf4a" stroke-width="1.4"/><rect x="520" y="16" width="236" height="28" rx="10" fill="#1d2223" fill-opacity="1" stroke="#ffcf4a" stroke-width="1.4"/><rect x="521" y="34" width="234" height="10" rx="0" fill="#1d2223" fill-opacity="1" stroke="#1d2223" stroke-width="0"/><circle cx="536.0" cy="30.0" r="4" fill="#ff7a92" fill-opacity="0.8" stroke="none" stroke-width="1.5"/><circle cx="550.0" cy="30.0" r="4" fill="#ffcf4a" fill-opacity="0.8" stroke="none" stroke-width="1.5"/><circle cx="564.0" cy="30.0" r="4" fill="#61db9c" fill-opacity="0.8" stroke="none" stroke-width="1.5"/><text x="582" y="30.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="600">노트북 셀 (Jupyter · Colab)</text><text x="534" y="58.5" font-size="11.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">셀 안은 파이썬이지만</text><text x="534" y="73.5" font-size="11.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">앞에 % 나 ! 를 붙이면 명령</text><text x="534" y="116.0" font-size="12" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">%pip install pandas</text><text x="534" y="142.0" font-size="12" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">!pip install pandas</text><rect x="520" y="198" width="236" height="58" rx="8" fill="#ffcf4a" fill-opacity="0.1" stroke="#ffcf4a" stroke-width="1.4"/><text x="638" y="218.9" font-size="12.5" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="600">% 는 지금 노트북 커널에 설치</text><text x="638" y="235.1" font-size="12.5" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="600">(Colab 은 ! 도 많이 씀)</text></svg>