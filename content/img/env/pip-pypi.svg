<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 352" width="780" height="352" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>PyPI 창고에서 pip이 패키지를 받아 내 컴퓨터 파이썬에 설치한다</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="20" y="30" width="220" height="220" rx="12" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.6"/><text x="130" y="56.0" font-size="18" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">PyPI</text><text x="130" y="78.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">파이썬 패키지 창고 (pypi.org)</text><rect x="38" y="98" width="88" height="30" rx="6" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="82" y="113.0" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">numpy</text><rect x="134" y="98" width="88" height="30" rx="6" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="178" y="113.0" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">pandas</text><rect x="38" y="138" width="88" height="30" rx="6" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="82" y="153.0" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">matplotlib</text><rect x="134" y="138" width="88" he