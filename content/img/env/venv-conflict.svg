<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 308" width="780" height="308" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>가상환경이 없으면 프로젝트끼리 버전이 충돌하고, 있으면 따로 쓴다</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="14" y="14" width="360" height="280" rx="12" fill="#121516" fill-opacity="1" stroke="#ff7a92" stroke-width="1.4"/><text x="194" y="38.0" font-size="14" fill="#ff7a92" text-anchor="middle" dominant-baseline="central" font-weight="700">가상환경 없이: 파이썬 하나를 같이 씀</text><rect x="34" y="60" width="150" height="56" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="109" y="80.0" font-size="13.5" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">프로젝트 A</text><text x="109" y="100.0" font-size="11.5" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">pandas 1.x 필요</text><line x1="109" y1="120" x2="194" y2="168" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="204" y="60" width="150" height="56" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="279" y="80.0" font-size="13.5" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">프로젝트 B</text><text x="279" y="100.0" font-size="11.5" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">pandas 2.x 필요</text><line x1="279" y1="120" x2="194" y2="168" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="74" y="172" width="240" height="64" rx="8" fill="#1d2223" fill-opacity="1" stroke="#ff7a92" stroke-width="1.6"/><text x="194" y="192.0" font-size="13.5" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">파이썬 (하나)</text><text x="194" y="216.0" font-size="12" fill="#ff7a92" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">pandas 2.x 만 설치됨</text><text x="194" y="266.0" font-size="13" fill="#ff7a92" text-anchor="middle" dominant-baseline="central" font-weight="600">B 에 맞춰 올리면 A 가 깨진다</text><rect x="392" y="14" width="374" height="280" rx="12" fill="#121516" fill-opacity="1" stroke="#61db9c" stroke-width="1.4"/><text x="579" y="38.0" font-size="14" fill="#61db9c" text-anchor="middle" dominant-baseline="central" font-weight="700">가상환경으로: 프로젝트마다 따로</text><rect x="410" y="60" width="164" height="176" rx="10" fill="#1d2223" fill-opacity="1" stroke="#61db9c" stroke-width="1.4"/><text x="492" y="82.0" font-size="13.5" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">프로젝트 A</text><rect x="424" y="102" width="136" height="116" rx="8" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="436" y="122.0" font-size="12.5" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">venv/</text><text x="436" y="150.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">파이썬</text><text x="436" y="176.0" font-size="12" fill="#61db9c" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">pandas 1.5.3</text><text x="436" y="200.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">numpy ...</text><rect x="592" y="60" width="164" height="176" rx="10" fill="#1d2223" fill-opacity="1" stroke="#61db9c" stroke-width="1.4"/><text x="674" y="82.0" font-size="13.5" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">프로젝트 B</text><rect x="606" y="102" width="136" height="116" rx="8" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="618" y="122.0" font-size="12.5" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">venv/</text><text x="618" y="150.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">파이썬</text><text x="618" y="176.0" font-size="12" fill="#61db9c" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">pandas 2.2.2</text><text x="618" y="200.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">numpy ...</text><text x="579" y="266.0" font-size="13" fill="#61db9c" text-anchor="middle" dominant-baseline="central" font-weight="600">서로 영향 없음</text></svg>