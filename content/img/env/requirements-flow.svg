<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 264" width="780" height="264" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>requirements.txt 로 환경을 저장하고 다른 PC 에서 되살리는 흐름</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="14" y="30" width="230" height="220" rx="12" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.5"/><text x="129" y="52.0" font-size="14" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">내 PC</text><rect x="30" y="68" width="198" height="84" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="42" y="86.0" font-size="12" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">(venv)</text><text x="42" y="110.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">pandas 2.2.2</text><text x="42" y="132.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">numpy 1.26.4</text><rect x="22" y="176" width="214" height="30" rx="15.0" fill="#c8ff3d" fill-opacity="0.14" stroke="#c8ff3d" stroke-width="1.4"/><text x="129.0" y="191.0" font-size="10.5" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">pip freeze &gt; requirements.txt</text><text x="129" y="228.0" font-size="12" fill="#c9cfcb" text-anchor="m