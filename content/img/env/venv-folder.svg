<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 332" width="788" height="332" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>가상환경을 만든 뒤 프로젝트 폴더 구조</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="14" y="14" width="760" height="302" rx="12" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.3"/><text x="34" y="44.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">my_project/</text><text x="420" y="44.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">프로젝트 폴더 (여기서 터미널을 연다)</text><line x1="44" y1="56" x2="44" y2="78" stroke="#3d4344" stroke-width="1.2"/><line x1="44" y1="78" x2="56" y2="78" stroke="#3d4344" stroke-width="1.2"/><text x="62" y="78.0" font-size="13" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">venv/</text><text x="420" y="78.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">python -m venv venv 가 만든 가상환경</text><line x1="72" y1="90" x2="72" y2="112" stroke="#3d4344" stroke-width="1.2"/><line x1="72" y1="112" x2="84" y2="112" stroke="#3d4344" stroke-width="1.2"/><text x="90" y="112.0" font-size="13" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">Scripts/   (macOS · Linux: bin/)</text><text x="420" y="112.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">activate, python, pip 이 들어 있음</text><line x1="72" y1="124" x2="72" y2="146" stroke="#3d4344" stroke-width="1.2"/><line x1="72" y1="146" x2="84" y2="146" stroke="#3d4344" stroke-width="1.2"/><text x="90" y="146.0" font-size="13" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">Lib/site-packages/</text><text x="420" y="146.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">이 프로젝트에 설치한 패키지가 쌓이는 곳</text><line x1="72" y1="158" x2="72" y2="180" stroke="#3d4344" stroke-width="1.2"/><line x1="72" y1="180" x2="84" y2="180" stroke="#3d4344" stroke-width="1.2"/><text x="90" y="180.0" font-size="13" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">pyvenv.cfg</text><text x="420" y="180.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">어떤 파이썬으로 만들었는지 기록</text><line x1="44" y1="192" x2="44" y2="214" stroke="#3d4344" stroke-width="1.2"/><line x1="44" y1="214" x2="56" y2="214" stroke="#3d4344" stroke-width="1.2"/><text x="62" y="214.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">app.py</text><text x="420" y="214.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">내 코드</text><line x1="44" y1="226" x2="44" y2="248" stroke="#3d4344" stroke-width="1.2"/><line x1="44" y1="248" x2="56" y2="248" stroke="#3d4344" stroke-width="1.2"/><text x="62" y="248.0" font-size="13" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">requirements.txt</text><text x="420" y="248.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">설치 목록 (다음 레슨)</text><line x1="44" y1="260" x2="44" y2="282" stroke="#3d4344" stroke-width="1.2"/><line x1="44" y1="282" x2="56" y2="282" stroke="#3d4344" stroke-width="1.2"/><text x="62" y="282.0" font-size="13" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">.gitignore</text><text x="420" y="282.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">Git 에 올리지 않을 것 (다음 레슨)</text><rect x="28" y="86" width="370" height="116" rx="8" fill="#66dbff" fill-opacity="0.06" stroke="#66dbff" stroke-width="1.2"/></svg>