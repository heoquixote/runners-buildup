<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 268" width="780" height="268" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>가상환경 작업 흐름: 처음 한 번 만들고, 작업할 때마다 켜고 끈다</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><text x="20" y="22.0" font-size="13" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700">처음 한 번</text><rect x="20" y="36" width="170" height="86" rx="10" fill="#1d2223" fill-opacity="1" stroke="#c9cfcb" stroke-width="1.5"/><text x="105" y="58.0" font-size="13.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="700">① 폴더 열기</text><text x="105" y="86.5" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">VS Code 에서</text><text x="105" y="101.5" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">프로젝트 폴더</text><line x1="192" y1="79" x2="208" y2="79" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="210" y="36" width="170" height="86" rx="10" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.5"/><text x="295" y="58.0" font-size="13.5" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">② 만들기</text><text x="295" y="94.0" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">python -m venv venv</text><line x1="382" y1="79" x2="398" y2="79" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="400" y="36" width="170" height="86" rx="10" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.5"/><text x="485" y="58.0" font-size="13.5" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">③ 인터프리터 선택</text><text x="485" y="86.5" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">VS Code 에서</text><text x="485" y="101.5" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">venv 파이썬</text><text x="20" y="152.0" font-size="13" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">작업할 때마다</text><rect x="20" y="166" width="170" height="86" rx="10" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.5"/><text x="105" y="188.0" font-size="13.5" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">④ 켜기</text><text x="105" y="216.5" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">activate</text><text x="105" y="231.5" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">→ (venv) 표시</text><line x1="192" y1="209" x2="208" y2="209" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="210" y="166" width="170" height="86" rx="10" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.5"/><text x="295" y="188.0" font-size="13.5" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">⑤ 설치 · 코딩</text><text x="295" y="216.5" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">python -m pip install …</text><text x="295" y="231.5" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">코드 실행</text><line x1="382" y1="209" x2="398" y2="209" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="400" y="166" width="170" height="86" rx="10" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.5"/><text x="485" y="188.0" font-size="13.5" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">⑥ 기록</text><text x="485" y="216.5" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">pip freeze &gt;</text><text x="485" y="231.5" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">requirements.txt</text><line x1="572" y1="209" x2="588" y2="209" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="590" y="166" width="170" height="86" rx="10" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.5"/><text x="675" y="188.0" font-size="13.5" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">⑦ 끄기</text><text x="675" y="224.0" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">deactivate</text><line x1="485" y1="124" x2="485" y2="138" stroke="#a1aaa5" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="485" y1="138" x2="160" y2="138" stroke="#a1aaa5" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="160" y1="138" x2="160" y2="162" stroke="#a1aaa5" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ah)"/></svg>