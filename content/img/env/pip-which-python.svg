<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 316" width="780" height="316" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>pip 과 python -m pip 이 설치하는 곳의 차이</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><text x="20" y="22.0" font-size="13" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">한 컴퓨터에 파이썬이 둘 있을 때 (예: python.org 3.12 + Anaconda 3.11)</text><rect x="470" y="50" width="290" height="90" rx="10" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.6"/><text x="486" y="72.0" font-size="14" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700">파이썬 A</text><text x="486" y="96.0" font-size="11.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">C:\Python312\python.exe</text><text x="486" y="120.0" font-size="11.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">site-packages/</text><rect x="470" y="160" width="290" height="90" rx="10" fill="#121516" fill-opacity="1" stroke="#ff9a51" stroke-width="1.6"/><text x="486" y="182.0" font-size="14" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="700">파이썬 B</text><text x="486" y="206.0" font-size="11.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">C:\anaconda3\python.exe</text><text x="486" y="230.0" font-size="11.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">site-packages/</text><rect x="20" y="70" width="250" height="34" rx="17.0" fill="#ffcf4a" fill-opacity="0.14" stroke="#ffcf4a" stroke-width="1.4"/><text x="145.0" y="87.0" font-size="12.5" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">pip install pandas</text><text x="20" y="116.2" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">PATH 에서 먼저 찾은 pip 이 설치.</text><text x="20" y="131.8" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">어느 파이썬인지 겉으로는 모른다</text><line x1="274" y1="87" x2="464" y2="87" stroke="#ffcf4a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/><line x1="274" y1="87" x2="464" y2="190" stroke="#ffcf4a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="372" y="122.0" font-size="22" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="700">?</text><rect x="20" y="200" width="250" height="34" rx="17.0" fill="#c8ff3d" fill-opacity="0.14" stroke="#c8ff3d" stroke-width="1.4"/><text x="145.0" y="217.0" font-size="12.5" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">python -m pip install pandas</text><text x="20" y="246.2" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">'지금 python 으로 실행되는 그 파이썬'에</text><text x="20" y="261.8" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">설치. 실행할 파이썬과 항상 같다</text><line x1="274" y1="217" x2="464" y2="110" stroke="#c8ff3d" stroke-width="2" marker-end="url(#aha)"/><text x="20" y="296.0" font-size="12.5" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="600">python 이 A 를 가리키면 A 에, 가상환경을 켜 두면 가상환경에 설치됩니다</text></svg>