<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 290" width="730" height="290" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>은닉층이 점을 새 공간으로 옮긴다</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="10" y="10" width="300" height="270" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="160" y="32.0" font-size="14" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="700">입력 공간 (x₁, x₂)</text><circle cx="80.0" cy="220.0" r="11" fill="#121516" fill-opacity="1" stroke="#ff7a92" stroke-width="2.4"/><text x="80" y="244.0" font-size="11" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">(0,0)</text><circle cx="80.0" cy="70.0" r="11" fill="#c8ff3d" fill-opacity="1" stroke="#c8ff3d" stroke-width="2.4"/><text x="80" y="94.0" font-size="11" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">(0,1)</text><circle cx="230.0" cy="220.0" r="11" fill="#c8ff3d" fill-opacity="1" stroke="#c8ff3d" stroke-width="2.4"/><text x="230" y="244.0" font-size="11" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">(1,0)</text><circle cx="230.0" cy="70.0" r="11" fill="#121516" fill-opacity="1" stroke="#ff7a92" stroke-width="2.4"/><text x="230" y="94.0" font-size="11" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">(1,1)</text><line x1="318" y1="135" x2="410" y2="135" stroke="#c8ff3d" stroke-width="2.4" marker-end="url(#aha)"/><text x="364" y="104.0" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">은닉층</text><text x="364" y="154.2" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="600">h₁ = OR</text><text x="364" y="169.8" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="600">h₂ = NAND</text><rect x="418" y="10" width="300" height="270" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="568" y="32.0" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">은닉 공간 (h₁, h₂)</text><circle cx="490.0" cy="70.0" r="11" fill="#121516" fill-opacity="1" stroke="#ff7a92" stroke-width="2.4"/><text x="490" y="94.0" font-size="11" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">(0,0)</text><circle cx="640.0" cy="70.0" r="11" fill="#c8ff3d" fill-opacity="1" stroke="#c8ff3d" stroke-width="2.4"/><text x="640" y="94.0" font-size="11" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">(0,1) (1,0)</text><circle cx="640.0" cy="220.0" r="11" fill="#121516" fill-opacity="1" stroke="#ff7a92" stroke-width="2.4"/><text x="640" y="244.0" font-size="11" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">(1,1)</text><line x1="557.5" y1="58.0" x2="652.0" y2="152.5" stroke="#ffcf4a" stroke-width="2.2" stroke-dasharray="6 4"/><text x="568" y="266.0" font-size="12" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="700">이제 직선 하나로 나뉜다</text></svg>