<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 246" width="800" height="246" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>RNN을 시간 순서로 펼친 모습</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="70" y="190" width="80" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="110.0" y="210.0" font-size="14" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">오늘</text><line x1="110" y1="188" x2="110" y2="142" stroke="#66dbff" stroke-width="1.6" marker-end="url(#ah)"/><rect x="64" y="92" width="92" height="48" rx="10" fill="#1d2223" fill-opacity="1" stroke="#a896ff" stroke-width="1.8"/><text x="110" y="116.0" font-size="13" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="700">RNN 셀</text><line x1="158" y1="116" x2="220" y2="116" stroke="#c8ff3d" stroke-width="2" marker-end="url(#aha)"/><text x="190" y="100.0" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">h1</text><rect x="230" y="190" width="80" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="270.0" y="210.0" font-size="14" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">날씨</text><line x1="270" y1="188" x2="270" y2="142" stroke="#66dbff" stroke-width="1.6" marker-end="url(#ah)"/><rect x="224" y="92" width="92" height="48" rx="10" fill="#1d2223" fill-opacity="1" stroke="#a896ff" stroke-width="1.8"/><text x="270" y="116.0" font-size="13" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="700">RNN 셀</text><line x1="318" y1="116" x2="380" y2="116" stroke="#c8ff3d" stroke-width="2" marker-end="url(#aha)"/><text x="350" y="100.0" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">h2</text><rect x="390" y="190" width="80" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="430.0" y="210.0" font-size="14" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">정말</text><line x1="430" y1="188" x2="430" y2="142" stroke="#66dbff" stroke-width="1.6" marker-end="url(#ah)"/><rect x="384" y="92" width="92" height="48" rx="10" fill="#1d2223" fill-opacity="1" stroke="#a896ff" stroke-width="1.8"/><text x="430" y="116.0" font-size="13" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="700">RNN 셀</text><line x1="478" y1="116" x2="540" y2="116" stroke="#c8ff3d" stroke-width="2" marker-end="url(#aha)"/><text x="510" y="100.0" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">h3</text><rect x="550" y="190" width="80" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="590.0" y="210.0" font-size="14" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">좋다</text><line x1="590" y1="188" x2="590" y2="142" stroke="#66dbff" stroke-width="1.6" marker-end="url(#ah)"/><rect x="544" y="92" width="92" height="48" rx="10" fill="#1d2223" fill-opacity="1" stroke="#a896ff" stroke-width="1.8"/><text x="590" y="116.0" font-size="13" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="700">RNN 셀</text><line x1="638" y1="116" x2="690" y2="116" stroke="#c8ff3d" stroke-width="2" marker-end="url(#aha)"/><rect x="694" y="94" width="90" height="44" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="739.0" y="107.5" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">긍정</text><text x="739.0" y="124.5" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">0.92</text><text x="380" y="30.0" font-size="13" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="600">같은 셀(같은 가중치)을 단어마다 다시 쓰며, 메모 h를 다음 칸으로 넘긴다</text><text x="380" y="56.0" font-size="12" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">h = 지금까지 읽은 내용의 요약</text></svg>