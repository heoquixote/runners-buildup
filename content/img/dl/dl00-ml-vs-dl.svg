<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 322" width="780" height="322" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>전통 머신러닝과 딥러닝의 차이</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="10" y="10" width="760" height="130" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="30" y="34.0" font-size="15" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700">전통 머신러닝 — 특징은 사람이 만든다</text><rect x="30" y="58" width="120" height="60" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="90.0" y="79.5" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">사진</text><text x="90.0" y="96.5" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">(숫자 격자)</text><line x1="156" y1="88" x2="196" y2="88" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><rect x="202" y="54" width="210" height="68" rx="8" fill="#1d2223" fill-opacity="1" stroke="#ffcf4a" stroke-width="1.2"/><text x="307.0" y="79.5" font-size="13" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="600">사람이 특징 설계</text><text x="307.0" y="96.5" font-size="13" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="600">귀 모양 · 털 무늬 · 색 …</text><line x1="418" y1="88" x2="458" y2="88" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><rect x="464" y="58" width="140" height="60" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="534.0" y="79.5" f