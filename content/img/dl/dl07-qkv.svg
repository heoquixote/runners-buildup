<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>어텐션: Q, K, V로 가중합 만들기</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="20" y="110" width="110" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="75.0" y="126.5" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">그것</text><text x="75.0" y="143.4" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">(Q: 찾는 것)</text><rect x="220" y="40" width="100" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="270.0" y="56.5" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">노즐</text><text x="270.0" y="73.5" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">(K)</text><line x1="132" y1="135" x2="216" y2="65" stroke="#a1aaa5" stroke-width="1.4" marker-end="url(#ah)"/><text x="360" y="65.0" font-size="15" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="800" font-family="'JetBrains Mono', Menlo, Consolas, monospace">2</text><text x="470" y="65.0" font-size="15" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="800" font-family="'JetBrains Mono', Menlo, Consolas, monospace">0.67</text><rect x="510" y="52" width="80.4" height="26" rx="3" fill="#c8ff3d" fill-opacity="0.45" stroke="#c8ff3d" stroke-width="1.2"/><rect x="650" y="40" width="90" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#a896ff" stroke-width="1.2"/><text x="695.0" y="56.5" font-size="13" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="600">노즐</text><text x="695.0" y="73.5" font-size="13" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="600">(V)</text><rect x="220" y="130" width="100" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="270.0" y="146.6" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">어제</text><text x="270.0" y="163.4" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">(K)</text><line x1="132" y1="135" x2="216" y2="155" stroke="#a1aaa5" stroke-width="1.4" marker-end="url(#ah)"/><text x="360" y="155.0" font-size="15" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="800" font-family="'JetBrains Mono', Menlo, Consolas, monospace">0</text><text x="470" y="155.0" font-size="15" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="800" font-family="'JetBrains Mono', Menlo, Consolas, monospace">0.09</text><rect x="510" y="142" width="10.799999999999999" height="26" rx="3" fill="#c8ff3d" fill-opacity="0.45" stroke="#c8ff3d" stroke-width="1.2"/><rect x="650" y="130" width="90" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#a896ff" stroke-width="1.2"/><text x="695.0" y="146.6" font-size="13" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="600">어제</text><text x="695.0" y="163.4" font-size="13" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="600">(V)</text><rect x="220" y="220" width="100" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="270.0" y="236.6" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">라