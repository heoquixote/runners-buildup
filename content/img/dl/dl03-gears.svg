<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>연쇄법칙을 톱니바퀴로 보기</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><polygon points="160.0,120.0 152.2,132.4 152.1,147.0 138.8,153.3 130.8,165.5 116.3,163.6 102.9,169.5 91.7,160.0 77.3,157.8 73.0,143.8 62.0,134.1 66.0,120.0 62.0,105.9 73.0,96.2 77.3,82.2 91.7,80.0 102.9,70.5 116.3,76.4 130.8,74.5 138.8,86.7 152.1,93.0 152.2,107.6" fill="#1d2223" stroke="#66dbff" stroke-width="2"/><text x="110" y="114.0" font-size="16" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="800">A</text><text x="110" y="134.0" font-size="11" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">1바퀴</text><polygon points="300.0,120.0 291.4,133.0 288.3,148.3 273.0,151.4 260.0,160.0 247.0,151.4 231.7,148.3 228.6,133.0 220.0,120.0 228.6,107.0 231.7,91.7 247.0,88.6 260.0,80.0 273.0,88.6 288.3,91.7 291.4,107.0" fill="#1d2223" stroke="#a896ff" stroke-width="2"/><text x="260" y="114.0" font-size="16" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="800">B</text><text x="260" y="134.0" font-size="11" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">2바퀴</text><polygon points="422.0,120.0 414.0,129.9 412.6,142.6 399.9,144.0 390.0,152.0 380.1,144.0 367.4,142.6 366.0,129.9 358.0,120.0 366.0,110.1 367.4,97.4 380.1,96.0 390.0,88.0 399.9,96.0 412.6,97.4 414.0,110.1" fill="#1d2223" stroke="#c8ff3d" stroke-width="2"/><text x="390" y="114.0" font-size="16" fill="#c8ff3d" text-a