<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196" width="720" height="196" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>잔차 연결</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="30" y="90" width="100" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="80.0" y="115.0" font-size="15" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">입력 x</text><line x1="132" y1="115" x2="190" y2="115" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><rect x="194" y="90" width="120" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c9cfcb" stroke-width="1.2"/><text x="254.0" y="115.0" font-size="15" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">층 1</text><line x1="316" y1="115" x2="370" y2="115" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><rect x="374" y="90" width="120" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c9cfcb" stroke-width="1.2"/><text x="434.0" y="115.0" font-size="15" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">층 2</text><line x1="496" y1="115" x2="548" y2="115" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><circle cx="570.0" cy="115.0" r="20" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="2"/><text x="570" y="115.0" font-size="22" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="800">+</text><line x1="592" y1="115" x2="640" y2="115" stroke="#c8ff3d" stroke-width="1.8" marker-end="url(#aha)"/><text x="670" y="115.0" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">출력</text><path d="M80,88 C80,24 570,24 570,92" fill="none" stroke="#c8ff3d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="325" y="30.0" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">지름길 (잔차 연결): x를 그대로 더한다</text><text x="350" y="176.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">기울기도 이 지름길로 곧장 앞층까지 흘러가서, 아주 깊게 쌓아도 잘 배운다 (ResNet)</text></svg>