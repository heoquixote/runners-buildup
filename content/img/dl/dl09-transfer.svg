<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 280" width="750" height="280" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>전이 학습</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="10" y="10" width="340" height="230" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="180" y="32.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">① 사전학습: 사진 수백만 장 · 1,000종</text><rect x="40" y="52" width="280" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="180.0" y="70.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">층 1 선</text><rect x="40" y="96" width="280" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="180.0" y="114.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">층 2 질감</text><rect x="40" y="140" width="280" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="180.0" y="158.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">층 3 모양</text><rect x="40" y="184" width="280" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#a1aaa5" stroke-width="1.2"/><text x="180.0" y="202.0" font-size="13" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="600">머리: 1,000종 분류</text><line x1="352" y1="125" x2="398" y2="125" stroke="#c8ff3d" stroke-width="2.2" marker-end="url(#aha)"/><rect x="400" y="10" width="340" height="230" rx="10" fill="#121516" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.6"/><text x="570" y="32.0" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">② 우리 공장: 불량 사진 500장</text><rect x="430" y="52" width="280" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c9cfcb" stroke-width="1.2"/><text x="570.0" y="70.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="600">층 1 선  🔒 고정</text><rect x="430" y="96" width="280" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c9cfcb" stroke-width="1.2"/><text x="570.0" y="114.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="600">층 2 질감  🔒 고정</text><rect x="430" y="140" width="280" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#ffcf4a" stroke-width="1.2"/><text x="570.0" y="158.0" font-size="12" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="600">층 3 모양  (선택) 살짝 조정</text><rect x="430" y="184" width="280" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="570.0" y="202.0" font-size="12" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">새 머리: 정상 / 불량  새로 학습</text><text x="375" y="262.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">몸통은 그대로 빌려 쓰고, 머리만 바꿔 우리 문제에 맞춘다</text></svg>