<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>컬러 이미지의 채널과 크기</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="40" y="30" width="170" height="140" rx="6" fill="#ff7a92" fill-opacity="0.25" stroke="#ff7a92" stroke-width="1.6"/><text x="200" y="158.0" font-size="12" fill="#ff7a92" text-anchor="end" dominant-baseline="central" font-weight="700">R (빨강)</text><rect x="74" y="56" width="170" height="140" rx="6" fill="#61db9c" fill-opacity="0.25" stroke="#61db9c" stroke-width="1.6"/><text x="234" y="184.0" font-size="12" fill="#61db9c" text-anchor="end" dominant-baseline="central" font-weight="700">G (초록)</text><rect x="108" y="82" width="170" height="140" rx="6" fill="#6aa8ff" fill-opacity="0.25" stroke="#6aa8ff" stroke-width="1.6"/><text x="268" y="210.0" font-size="12" fill="#6aa8ff" text-anchor="end" dominant-baseline="central" font-weight="700">B (파랑)</text><text x="150" y="230.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">컬러 사진 = 숫자 격자 3장 겹침</text><rect x="330" y="40" width="370" height="170" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="515" y="70.0" font-size="15" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">100 × 100 × 3 = 30,000개 숫자</text><text x="515" y="112.0" font-size="13" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">한 줄로 펼쳐 은닉 노드 1,000개에 연결하면</text><text x="515" y="142.0" font-size="15" fill="#ff7a92" text-anchor="middle" dominant-baseline="central" font-weight="800" font-family="'JetBrains Mono', Menlo, Consolas, monospace">30,000 × 1,000 = 3,000만 개 가중치</text><text x="515" y="180.0" font-size="13" fill="#ff7a92" text-anchor="middle" dominant-baseline="central" font-weight="600">첫 층 하나만으로!</text></svg>