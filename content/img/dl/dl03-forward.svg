<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>순전파 손 계산 예</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><circle cx="80.0" cy="90.0" r="26" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.8"/><text x="80" y="90.0" font-size="12" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">x₁ = 1</text><circle cx="80.0" cy="210.0" r="26" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.8"/><text x="80" y="210.0" font-size="12" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">x₂ = 2</text><line x1="106.0" y1="90.0" x2="300.0" y2="90.0" stroke="#a1aaa5" stroke-width="1.4" marker-end="url(#ah)"/><text x="155.0" y="80.0" font-size="12" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">w=0.5</text><line x1="103.43959949417511" y1="101.25100775720405" x2="302.9543082759518" y2="197.01806797245686" stroke="#a1aaa5" stroke-width="1.4" marker-end="url(#ah)"/><text x="155.0" y="116.0" font-size="12" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">w=1</text><line x1="103.43959949417511" y1="198.74899224279594" x2="302.9543082759518" y2="102.98193202754314" stroke="#a1aaa5" stroke-width="1.4" marker-end="url(#ah)"/><text x="155.0" y="164.0" font-size="12" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">w=0.5</text><line x1="106.0" y1="210.0" x2="300.0" y2="210.0" stroke="#a1aaa5" stroke-width="1.4" marker-end="url(#ah)"/><text x="155.0" y="200.0" font-size="12" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">w=−1</text><circle cx="330.0" cy="90.0" r="30" fill="#1d2223" fill-opacity="1" stroke="#a896ff" stroke-width="1.8"/><text x="330" y="90.0" font-size="15" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="700">h₁</text><text x="330" y="30.9" font-size="11" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">z = 0.5·1 + 0.5·2 − 1 = 0.5</text><text x="330" y="45.1" font-size="11" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">ReLU → 0.5</text><line x1="359.2317358708386" y1="96.74578520096276" x2="560.7682641291614" y2="143.25421479903724" stroke="#a1aaa5" stroke-width="1.4" marker-end="url(#ah)"/><text x="460.0" y="106.0" font-size="12" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">w=2</text><circle cx="330.0" cy="210.0" r="30" fill="#1d2223" fill-opacity="1" stroke="#a896ff" stroke-width="1.8"/><text x="330" y="210.0" font-size="15" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="700">h₂</text><text x="330" y="254.8" font-size="11" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">z = 1·1 − 1·2 + 0 = −1</text><text x="330" y="269.1" font-size="11" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">ReLU → 0</text><line x1="359.2317358708386" y1="203.25421479903724" x2="560.7682641291614" y2="156.74578520096276" stroke="#a1aaa5" stroke-width="1.4" marker-end="url(#ah)"/><text x="460.0" y="166.0" font-size="12" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">w=3</text><circle cx="590.0" cy="150.0" r="30" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.8"/><text x="590" y="150.0" font-size="16" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">ŷ</text><text x="590" y="196.2" font-size="12" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">2·0.5 + 3·0 + 0.5</text><text x="590" y="211.8" font-size="12" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">= 1.5</text><text x="40" y="290.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="600">편향: h₁ −1, h₂ 0, 출력 0.5</text><text x="640" y="136.2" font-size="12" fill="#ffcf4a" text-anchor="start" dominant-baseline="central" font-weight="700">정답 2</text><text x="640" y="151.8" font-size="12" fill="#ffcf4a" text-anchor="start" dominant-baseline="central" font-weight="700">손실 (2−1.5)² = 0.25</text></svg>