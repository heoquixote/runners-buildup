<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="720" height="296" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>LSTM 셀의 세 게이트</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="60" y="70" width="600" height="186" rx="14" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><line x1="20" y1="100" x2="700" y2="100" stroke="#c8ff3d" stroke-width="3" marker-end="url(#aha)"/><text x="20" y="56.0" font-size="13" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">셀 상태 (장기 기억의 컨베이어 벨트)</text><circle cx="190.0" cy="100.0" r="16" fill="#1d2223" fill-opacity="1" stroke="#ff7a92" stroke-width="2"/><text x="190" y="100.0" font-size="18" fill="#ff7a92" text-anchor="middle" dominant-baseline="central" font-weight="800">×</text><line x1="190" y1="170" x2="190" y2="118" stroke="#ff7a92" stroke-width="1.8" marker-end="url(#ah)"/><rect x="116" y="172" width="148" height="72" rx="10" fill="#1d2223" fill-opacity="1" stroke="#ff7a92" stroke-width="1.6"/><text x="190" y="191.0" font-size="13" fill="#ff7a92" text-anchor="middle" dominant-baseline="central" font-weight="700">잊기 게이트</text><text x="190" y="214.8" font-size="11" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">지난 기억 중</text><text x="190" y="229.2" font-size="11" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">무엇을 버릴까?</text><circle cx="360.0" cy="100.0" r="16" fill="#1d2223" fill-opacity="1" stroke="#61db9c" stroke-width="2"/><text x="360" y="100.0" font-size="18" fill="#61db9c" text-anchor="middle" dominant-baseline="central" font-weight="800">+</text><line x1="360" y1="170" x2="360" y2="118" stroke="#61db9c" stroke-width="1.8" marker-end="url(#ah)"/><rect x="286" y="172" width="148" height="72" rx="10" fill="#1d2223" fill-opacity="1" stroke="#61db9c" stroke-width="1.6"/><text x="360" y="191.0" font-size="13" fill="#61db9c" text-anchor="middle" dominant-baseline="central" font-weight="700">입력 게이트</text><text x="360" y="214.8" font-size="11" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">새 정보 중</text><text x="360" y="229.2" font-size="11" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">무엇을 적을까?</text><line x1="530" y1="102" x2="530" y2="150" stroke="#66dbff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="456" y="172" width="148" height="72" rx="10" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.6"/><text x="530" y="191.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">출력 게이트</text><text x="530" y="214.8" font-size="11" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">지금 무엇을</text><text x="530" y="229.2" font-size="11" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">내보낼까?</text><text x="360" y="278.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">게이트 = 0(닫힘) ~ 1(열림) 밸브. 벨트 위 정보가 곱 대신 덧셈으로 흘러 기울기가 덜 사라진다</text><text x="600" y="50.0" font-size="12" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">→ h (출력)</text></svg>