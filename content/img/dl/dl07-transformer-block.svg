<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" width="740" height="380" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>Transformer 블록</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="260" y="330" width="200" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="360.0" y="350.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">토큰 임베딩 + 위치 정보</text><rect x="220" y="70" width="280" height="240" rx="14" fill="#121516" fill-opacity="1" stroke="#a896ff" stroke-width="1.8"/><text x="520" y="80.0" font-size="14" fill="#a896ff" text-anchor="start" dominant-baseline="central" font-weight="700">× N번 쌓기</text><rect x="250" y="240" width="220" height="46" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="360.0" y="263.0" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">멀티헤드 셀프 어텐션</text><rect x="250" y="170" width="220" height="34" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="360.0" y="187.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="600">더하기 (잔차) + 정규화</text><rect x="250" y="120" width="220" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#ff9a51" stroke-width="1.2"/><text x="360.0" y="140.0" font-size="13" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="600">피드포워드 (작은 MLP)</text><rect x="250" y="80" width="220" height="30" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="360.0" y="95.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="600">더하기 (잔차) + 정규화</text><line x1="360" y1="328" x2="360" y2="288" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><line x1="360" y1="238" x2="360" y2="206" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><line x1="360" y1="168" x2="360" y2="162" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><line x1="360" y1="118" x2="360" y2="112" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><line x1="360" y1="78" x2="360" y2="40" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="280" y="6" width="160" height="34" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="360.0" y="23.0" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">다음 토큰 확률</text><text x="110" y="255.2" font-size="12" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">단어끼리 서로 참고</text><text x="110" y="270.8" font-size="12" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">(여러 관점 동시에)</text><text x="110" y="132.2" font-size="12" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="600">단어마다 따로</text><text x="110" y="147.8" font-size="12" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="600">정보 다듬기</text><text x="620" y="342.2" font-size="12" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">위치 정보: 어텐션은</text><text x="620" y="357.8" font-size="12" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">순서를 모르므로 더해 준다</text></svg>