<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>평행 vs 엇갈림</title><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8fcf"/></marker></defs><rect x="30" y="20" width="315" height="170" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><path d="M100,133.0 L275,91.0" fill="none" stroke="#66dbff" stroke-width="2.6" stroke-linecap="round"/><circle cx="100" cy="133.0" r="5" fill="#66dbff" fill-opacity="1" stroke="none"/><circle cx="275" cy="91.0" r="5" fill="#66dbff" fill-opacity="1" stroke="none"/><text x="285" y="91.0" font-size="11" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="500">group 1</text><path d="M100,105.0 L275,63.0" fill="none" stroke="#ff9a51" stroke-width="2.6" stroke-linecap="round"/><circle cx="100" cy="105.0" r="5" fill="#ff9a51" fill-opacity="1" stroke="none"/><circle cx="275" cy="63.0" r="5" fill="#ff9a51" fill-opacity="1" stroke="none"/><text x="285" y="63.0" font-size="11" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="500">group 2</text><text x="100" y="183" font-size="11" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">condition A</text><text x="275" y="183" font-size="11" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">condition B</text><text x="187.5" y="212" font-size="14" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">선이 평행</text><text x="187.5" y="236" font-size="12" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">B의 효과가 조건과 상관없이 일정</text><rect x="375" y="20" width="315" height="170" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><path d="M445,133.0 L620,70.0" fill="none" stroke="#66dbff" stroke-width="2.6" stroke-linecap="round"/><circle cx="445" cy="133.0" r="5" fill="#66dbff" fill-opacity="1" stroke="none"/><circle cx="620" cy="70.0" r="5" fill="#66dbff" fill-opacity="1" stroke="none"/><text x="630" y="70.0" font-size="11" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="500">group 1</text><path d="M445,77.0 L620,126.0" fill="none" stroke="#ff9a51" stroke-width="2.6" stroke-linecap="round"/><circle cx="445" cy="77.0" r="5" fill="#ff9a51" fill-opacity="1" stroke="none"/><circle cx="620" cy="126.0" r="5" fill="#ff9a51" fill-opacity="1" stroke="none"/><text x="630" y="126.0" font-size="11" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="500">group 2</text><text x="445" y="183" font-size="11" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">condition A</text><text x="620" y="183" font-size="11" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">condition B</text><text x="532.5" y="212" font-size="14" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">선이 엇갈림</text><text x="532.5" y="236" font-size="12" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="600">조건에 따라 효과가 달라진다</text></svg>