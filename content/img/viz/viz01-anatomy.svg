<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>matplotlib 그래프의 부품</title><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8fcf"/></marker></defs><rect x="20" y="20" width="680" height="360" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2" stroke-dasharray="6 4"/><text x="40" y="38" font-size="13" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">Figure (fig) = 도화지</text><rect x="110" y="70" width="380" height="250" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.4"/><text x="112" y="60" font-size="12" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="500">Axes (ax) = 그래프 한 칸</text><path d="M150,160 L470,160" fill="none" stroke="#3d4344" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M150,200 L470,200" fill="none" stroke="#3d4344" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M150,240 L470,240" fill="none" stroke="#3d4344" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M150,280 L470,280" fill="none" stroke="#3d4344" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M150,110 L150,290" fill="none" stroke="#a1aaa5" stroke-width="1.4" stroke-linecap="round"/><path d="M150,290 L470,290" fill="none" stroke="#a1aaa5" stroke-width="1.4" stroke-linecap="round"/><path d="M180,290 L180,295" fill="none" stroke="#a1aaa5" stroke-width="1.2" stroke-linecap="round"/><path d="M240,290 L240,295" fill="none" stroke="#a1aaa5" stroke-width="1.2" stroke-linecap="round"/><path d="M300,290 L300,295" fill="none" stroke="#a1aaa5" stroke-width="1.2" stroke-linecap="round"/><path d="M360,290 L360,295" fill="none" stroke="#a1aaa5" stroke-width="1.2" stroke-linecap="round"/><path d="M420,290 L420,295" fill="none" stroke="#a1aaa5" stroke-width="1.2" stroke-linecap="round"/><path d="M460,290 L460,295" fill="none" stroke="#a1aaa5" stroke-width="1.2" stroke-linecap="round"/><path d="M180,250 L240,215 L300,230 L360,170 L420,140 L460,125" fill="none" fill-opacity="1" stroke="#66dbff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="250" r="4" fill="#66dbff" fill-opacity="1" stroke="none"/><circle cx="240" cy="215" r="4" fill="#66dbff" fill-opacity="1" stroke="none"/><circle cx="300" cy="230" r="4" fill="#66dbff" fill-opacity="1" stroke="none"/><circle cx="360" cy="170" r="4" fill="#66dbff" fill-opacity="1" stroke="none"/><circle cx="420" cy="140" r="4" fill="#66dbff" fill-opacity="1" stroke="none"/><circle cx="460" cy="125" r="4" fill="#66dbff" fill-opacity="1" stroke="none"/><path d="M180,270 L240,255 L300,250 L360,235 L420,225 L460,215" fill="none" fill-opacity="1" stroke="#ff9a51" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="380" y="105" width="80" height="42" rx="5" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><path d="M388,118 L404,118" fill="none" stroke="#66dbff" stroke-width="2.4" stroke-linecap="round"/><text x="410" y="118" font-size="11" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">A</text><path d="M388,135 L404,135" fill="none" stroke="#ff9a51" stroke-width="2.4" stroke-linecap="round"/><text x="410" y="135" font-size="11" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">B</text><text x="310" y="102" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">Visits by day</text><text x="310" y="310" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">Day</text><text x="128" y="200" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">Visits</text><path d="M536,102 L366,102" fill="none" stroke="#3d4344" stroke-width="1.1" stroke-linecap="round"/><circle cx="364" cy="102" r="3" fill="#ff8fcf" fill-opacity="1" stroke="none"/><text x="545" y="94" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="700">제목</text><text x="545" y="111" font-size="12" fill="#ff8fcf" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ax.set_title()</text><path d="M536,142 L468,126" fill="none" stroke="#3d4344" stroke-width="1.1" stroke-linecap="round"/><circle cx="466" cy="126" r="3" fill="#ff8fcf" fill-opacity="1" stroke="none"/><text x="545" y="134" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="700">범례</text><text x="545" y="151" font-size="12" fill="#ff8fcf" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">label= + ax.legend()</text><path d="M536,182 L426,165" fill="none" stroke="#3d4344" stroke-width="1.1" stroke-linecap="round"/><circle cx="424" cy="165" r="3" fill="#ff8fcf" fill-opacity="1" stroke="none"/><text x="545" y="174" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="700">선 · 막대 · 점</text><text x="545" y="191" font-size="12" fill="#ff8fcf" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ax.plot() · ax.bar()</text><path d="M536,222 L476,200" fill="none" stroke="#3d4344" stroke-width="1.1" stroke-linecap="round"/><circle cx="474" cy="200" r="3" fill="#ff8fcf" fill-opacity="1" stroke="none"/><text x="545" y="214" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="700">격자</text><text x="545" y="231" font-size="12" fill="#ff8fcf" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ax.grid()</text><path d="M536,262 L466,296" fill="none" stroke="#3d4344" stroke-width="1.1" stroke-linecap="round"/><circle cx="464" cy="296" r="3" fill="#ff8fcf" fill-opacity="1" stroke="none"/><text x="545" y="254" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="700">눈금</text><text x="545" y="271" font-size="12" fill="#ff8fcf" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ax.set_xticks()</text><path d="M536,302 L336,310" fill="none" stroke="#3d4344" stroke-width="1.1" stroke-linecap="round"/><circle cx="334" cy="310" r="3" fill="#ff8fcf" fill-opacity="1" stroke="none"/><text x="545" y="294" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="700">x축 이름</text><text x="545" y="311" font-size="12" fill="#ff8fcf" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ax.set_xlabel()</text><path d="M108,178 L128,192" fill="none" stroke="#3d4344" stroke-width="1.1" stroke-linecap="round"/><text x="66" y="150" font-size="12" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">y축 이름</text><text x="66" y="168" font-size="11" fill="#ff8fcf" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">set_ylabel()</text><text x="300" y="352" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">fig, ax = plt.subplots(figsize=(가로, 세로))</text></svg>