<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>칸 단위 함수와 그림 단위 함수</title><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8fcf"/></marker></defs><text x="180" y="24" font-size="15" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">칸 단위 (axes-level)</text><rect x="30" y="44" width="300" height="170" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2" stroke-dasharray="6 4"/><text x="44" y="60" font-size="11" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">내가 만든 fig</text><rect x="45" y="72" width="130" height="128" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><rect x="185" y="72" width="130" height="128" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.6"/><rect x="205" y="135" width="22" height="50" rx="2" fill="#66dbff" fill-opacity="0.8" stroke="none" stroke-width="1.2"/><rect x="237" y="105" width="22" height="80" rx="2" fill="#66dbff" fill-opacity="0.8" stroke="none" stroke-width="1.2"/><rect x="269" y="120" width="22" height="65" rx="2" fill="#66dbff" fill-opacity="0.8" stroke="none" stroke-width="1.2"/><text x="110" y="136" font-size="13" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ax1</text><text x="180" y="238" font-size="12" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sns.histplot(..., ax=ax2)</text><text x="180" y="262" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">→ 지정한 칸 하나에 그리고 ax를 돌려줌</text><text x="540" y="24" font-size="15" fill="#ff8fcf" text-anchor="middle" dominant-baseline="central" font-weight="700">그림 단위 (figure-level)</text><rect x="390" y="44" width="300" height="170" rx="10" fill="#121516" fill-opacity="1" stroke="#ff8fcf" stroke-width="1.4"/><text x="404" y="60" font-size="11" fill="#ff8fcf" text-anchor="start" dominant-baseline="central" font-weight="500">새 fig를 스스로 만듦</text><rect x="405" y="72" width="130" height="128" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="470" y="86" font-size="11" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">time = Lunch</text><rect x="427" y="150" width="22" height="40" rx="2" fill="#ff8fcf" fill-opacity="0.8" stroke="none" stroke-width="1.2"/><rect x="459" y="120" width="22" height="70" rx="2" fill="#ff8fcf" fill-opacity="0.8" stroke="none" stroke-width="1.2"/><rect x="491" y="135" width="22" height="55" rx="2" fill="#ff8fcf" fill-opacity="0.8" stroke="none" stroke-width="1.2"/><rect x="545" y="72" width="130" height="128" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="610" y="86" font-size="11" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">time = Dinner</text><rect x="567" y="130" width="22" height="60" rx="2" fill="#ff8fcf" fill-opacity="0.8" stroke="none" stroke-width="1.2"/><rect x="599" y="130" width="22" height="60" rx="2" fill="#ff8fcf" fill-opacity="0.8" stroke="none" stroke-width="1.2"/><rect x="631" y="110" width="22" height="80" rx="2" fill="#ff8fcf" fill-opacity="0.8" stroke="none" stroke-width="1.2"/><text x="540" y="238" font-size="12" fill="#ff8fcf" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sns.catplot(..., col="time")</text><text x="540" y="262" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">→ 값마다 칸을 나누고 Grid를 돌려줌</text></svg>