<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>확률변수</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><text x="110" y="20.0" font-size="13" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="700">결과 (표본공간)</text><text x="360" y="20.0" font-size="13" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="700">앞면 수 X</text><text x="590" y="20.0" font-size="13" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="700">확률</text><rect x="50" y="50" width="120" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="110.0" y="70.0" font-size="14" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">앞 앞</text><line x1="172" y1="70" x2="326" y2="62" stroke="#a896ff" stroke-width="1.6" marker-end="url(#ah)"/><rect x="50" y="110" width="120" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="110.0" y="130.0" font-size="14" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">앞 뒤</text><line x1="172" y1="130" x2="326" y2="142" stroke="#a896ff" stroke-width="1.6" marker-end="url(#ah)"/><rect x="50" y="170" width="120" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="110.0" y="190.0" font-size="14" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">뒤 앞</text><line x1="172" y1="190" x2="326" y2="142" stroke="#a896ff" stroke-width="1.6" marker-end="url(#ah)"/><rect x="50" y="230" width="120" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="110.0" y="250.0" font-size="14" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">뒤 뒤</text><line x1="172" y1="250" x2="326" y2="222" stroke="#a896ff" stroke-width="1.6" marker-end="url(#ah)"/><rect x="330" y="40" width="60" height="44" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="360.0" y="62.0" font-size="18" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">2</text><line x1="394" y1="62" x2="540" y2="62" stroke="#a1aaa5" stroke-width="1.4" marker-end="url(#ah)"/><text x="590" y="62.0" font-size="14" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">P(X=2) = 1/4</text><rect x="330" y="120" width="60" height="44" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="360.0" y="142.0" font-size="18" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">1</text><line x1="394" y1="142" x2="540" y2="142" stroke="#a1aaa5" stroke-width="1.4" marker-end="url(#ah)"/><text x="590" y="142.0" font-size="14" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">P(X=1) = 2/4</text><rect x="330" y="200" width="60" height="44" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="360.0" y="222.0" font-size="18" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">0</text><line x1="394" y1="222" x2="540" y2="222" stroke="#a1aaa5" stroke-width="1.4" marker-end="url(#ah)"/><text x="590" y="222.0" font-size="14" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">P(X=0) = 1/4</text></svg>