<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>상자그림과 1.5 IQR 규칙</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="196" y="76" width="156" height="68" rx="4" fill="#c8ff3d" fill-opacity="0.12" stroke="#c8ff3d" stroke-width="1.6"/><line x1="274" y1="76" x2="274" y2="144" stroke="#c8ff3d" stroke-width="2.6"/><line x1="92" y1="110" x2="196" y2="110" stroke="#c9cfcb" stroke-width="1.6"/><line x1="352" y1="110" x2="495.0" y2="110" stroke="#c9cfcb" stroke-width="1.6"/><line x1="92" y1="96" x2="92" y2="124" stroke="#c9cfcb" stroke-width="1.6"/><line x1="495.0" y1="96" x2="495.0" y2="124" stroke="#c9cfcb" stroke-width="1.6"/><circle cx="651.0" cy="110.0" r="6" fill="#ff8fcf" fill-opacity="1" stroke="none" stroke-width="1.5"/><text x="651.0" y="88.0" font-size="12" fill="#ff8fcf" text-anchor="middle" dominant-baseline="central" font-weight="700">이상치 후보</text><text x="196" y="28.2" font-size="12" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">Q1</text><text x="196" y="43.8" font-size="12" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">(25%)</text><text x="274" y="28.2" font-size="12" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">중앙값</text><text x="274" y="43.8" font-size="12" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">(50%)</text><text x="352" y="28.2" font-size="12" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">Q3</text><text x="352" y="43.8" font-size="12" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">(75%)</text><path d="M196,160 L196,168 L352,168 L352,160" fill="none" stroke="#c8ff3d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="274" y="184.0" font-size="12" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">IQR = Q3 − Q1 (가운데 50%)</text><path d="M352,200 L352,208 L586.0,208 L586.0,200" fill="none" stroke="#a1aaa5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="469.0" y="224.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="600">최대 1.5 × IQR</text><text x="92" y="146.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">수염</text><text x="586" y="146.0" font-size="11" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">이 경계 밖 → 점으로</text><line x1="586" y1="90" x2="586" y2="130" stroke="#a1aaa5" stroke-width="1.2" stroke-dasharray="3 3"/></svg>