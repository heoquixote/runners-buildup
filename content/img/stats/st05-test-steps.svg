<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>가설검정 4단계</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="14" y="30" width="156" height="150" rx="10" fill="#1d2223" fill-opacity="1" stroke="#c9cfcb" stroke-width="1.2"/><circle cx="40.0" cy="56.0" r="14" fill="#c9cfcb" fill-opacity="1" stroke="none" stroke-width="1.5"/><text x="40" y="56.0" font-size="13" fill="#121516" text-anchor="middle" dominant-baseline="central" font-weight="800">1</text><text x="106" y="56.0" font-size="14" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="700">가설 세우기</text><text x="92" y="112.2" font-size="12" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="500">H₀: 차이 없음</text><text x="92" y="127.8" font-size="12" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="500">H₁: 차이 있음</text><line x1="172" y1="105" x2="188" y2="105" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="190" y="30" width="156" height="150" rx="10" fill="#1d2223" fill-opacity="1" stroke="#c9cfcb" stroke-width="1.2"/><circle cx="216.0" cy="56.0" r="14" fill="#c9cfcb" fill-opacity="1" stroke="none" stroke-width="1.5"/><text x="216" y="56.0" font-size="13" fill="#121516" text-anchor="middle" dominant-baseline="central" font-weight="800">2</text><text x="282" y="56.0" font-size="14" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="700">통계량 계산</text><text x="268" y="112.2" font-size="12" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="500">데이터에서</text><text x="268" y="127.8" font-size="12" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="500">t, χ² 등</text><line x1="348" y1="105" x2="364" y2="105" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="366" y="30" width="156" height="150" rx="10" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.8"/><circle cx="392.0" cy="56.0" r="14" fill="#c8ff3d" fill-opacity="1" stroke="none" stroke-width="1.5"/><text x="392" y="56.0" font-size="13" fill="#121516" text-anchor="middle" dominant-baseline="central" font-weight="800">3</text><text x="458" y="56.0" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">p-value 계산</text><text x="444" y="112.2" font-size="12" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="500">H₀가 맞는 세상에서</text><text x="444" y="127.8" font-size="12" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="500">이만큼 드문가?</text><line x1="524" y1="105" x2="540" y2="105" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="542" y="30" width="156" height="150" rx="10" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><circle cx="568.0" cy="56.0" r="14" fill="#66dbff" fill-opacity="1" stroke="none" stroke-width="1.5"/><text x="568" y="56.0" font-size="13" fill="#121516" text-anchor="middle" dominant-baseline="central" font-weight="800">4</text><text x="634" y="56.0" font-size="14" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">판단</text><text x="620" y="112.2" font-size="12" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="500">p &lt; α 이면</text><text x="620" y="127.8" font-size="12" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="500">H₀ 기각</text></svg>