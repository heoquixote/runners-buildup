<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>표본공간과 사건</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="40" y="30" width="440" height="240" rx="10" fill="#121516" fill-opacity="1" stroke="#c9cfcb" stroke-width="1.4"/><text x="60" y="50.0" font-size="13" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="600">표본공간 S = {1, 2, 3, 4, 5, 6}</text><circle cx="210.0" cy="160.0" r="92" fill="#66dbff" fill-opacity="0.12" stroke="#66dbff" stroke-width="1.8"/><circle cx="310.0" cy="160.0" r="92" fill="#ff8fcf" fill-opacity="0.12" stroke="#ff8fcf" stroke-width="1.8"/><text x="112" y="100.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">A: 짝수</text><text x="412" y="100.0" font-size="13" fill="#ff8fcf" text-anchor="middle" dominant-baseline="central" font-weight="700">B: 4 이상</text><text x="165" y="165.0" font-size="22" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">2</text><text x="260" y="135.0" font-size="22" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">4</text><text x="260" y="190.0" font-size="22" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">6</text><text x="360" y="165.0" font-size="22" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">5</text><text x="80" y="240.0" font-size="22" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">1</text><text x="440" y="240.0" font-size="22" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">3</text><text x="600" y="80.9" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">A 그리고 B</text><text x="600" y="99.1" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">= {4, 6}</text><text x="600" y="160.9" font-size="14" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">A 또는 B</text><text x="600" y="179.1" font-size="14" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">= {2, 4, 5, 6}</text><text x="600" y="240.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">P(A) = 3/6 = 0.5</text><line x1="540" y1="96" x2="278" y2="162" stroke="#c8ff3d" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#aha)"/></svg>