<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 875 418" width="875" height="418" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>검정 고르기 지도: 데이터 종류(열)와 그룹 구조(행)로 검정을 고른다</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="170" y="10" width="225" height="46" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.8"/><text x="282.5" y="33.0" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">연속형 · 정규에 가까움</text><rect x="405" y="10" width="225" height="46" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.8"/><text x="517.5" y="33.0" font-size="14" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">연속형 · 치우침 / 순서형</text><rect x="640" y="10" width="225" height="46" rx="8" fill="#1d2223" fill-opacity="1" stroke="#ff9a51" stroke-width="1.8"/><text x="752.5" y="33.0" font-size="14" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="700">범주형 (비율 · 도수)</text><rect x="10" y="66" width="150" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="85.0" y="89.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">1그룹 vs 기준값</text><rect x="170" y="66" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.0"/><text x="282.5" y="89.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">1표본 t (σ를 알면 z)</text><rect x="405" y="66" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.0"/><text x="517.5" y="89.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">부호검정 · 윌콕슨 부호순위</text><rect x="640" y="66" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#ff9a51" stroke-width="1.0"/><text x="752.5" y="89.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">이항 · 1비율 z · 적합도 χ²</text><rect x="10" y="120" width="150" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="85.0" y="143.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">2그룹 · 독립</text><rect x="170" y="120" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.0"/><text x="282.5" y="143.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">Welch t</text><rect x="405" y="120" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.0"/><text x="517.5" y="143.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">맨-휘트니 U</text><rect x="640" y="120" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#ff9a51" stroke-width="1.0"/><text x="752.5" y="143.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">2비율 z · χ² · 피셔 정확</text><rect x="10" y="174" width="150" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="85.0" y="197.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">2그룹 · 대응</text><rect x="170" y="174" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.0"/><text x="282.5" y="197.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">대응 t</text><rect x="405" y="174" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.0"/><text x="517.5" y="197.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">윌콕슨 부호순위 · 부호검정</text><rect x="640" y="174" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#ff9a51" stroke-width="1.0"/><text x="752.5" y="197.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">McNemar</text><rect x="10" y="228" width="150" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="85.0" y="251.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">3그룹 이상 · 독립</text><rect x="170" y="228" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.0"/><text x="282.5" y="251.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">ANOVA (+Tukey) · 이원 ANOVA</text><rect x="405" y="228" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.0"/><text x="517.5" y="251.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">크루스칼-월리스</text><rect x="640" y="228" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#ff9a51" stroke-width="1.0"/><text x="752.5" y="251.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">χ² 독립성</text><rect x="10" y="282" width="150" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="85.0" y="305.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">3그룹 이상 · 대응</text><rect x="170" y="282" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.0"/><text x="282.5" y="305.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">반복측정 ANOVA</text><rect x="405" y="282" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.0"/><text x="517.5" y="305.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">프리드먼</text><rect x="640" y="282" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#ff9a51" stroke-width="1.0"/><text x="752.5" y="305.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">코크런 Q</text><rect x="10" y="336" width="150" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="85.0" y="359.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">두 변수의 관계</text><rect x="170" y="336" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.0"/><text x="282.5" y="359.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">피어슨 r · 회귀 F</text><rect x="405" y="336" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.0"/><text x="517.5" y="359.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">스피어만 · 켄달</text><rect x="640" y="336" width="225" height="46" rx="8" fill="#121516" fill-opacity="1" stroke="#ff9a51" stroke-width="1.0"/><text x="752.5" y="359.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">χ² 독립성 · 크래머 V</text><text x="437" y="402.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">검정 전 확인: 정규성은 Q-Q 플롯 · 샤피로, 등분산은 레빈   |   여러 번 검정하면: Holm · BH 보정</text></svg>