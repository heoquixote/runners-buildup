<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 324" width="750" height="324" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>PyTorch 학습 반복의 네 단계</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="30" y="20" width="300" height="100" rx="12" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.8"/><text x="48" y="44.0" font-size="14.5" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700">① 예측 (순전파)</text><text x="48" y="74.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">pred = model(X)</text><text x="48" y="100.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">지금 가중치로 답 내기</text><rect x="420" y="20" width="300" height="100" rx="12" fill="#1d2223" fill-opacity="1" stroke="#ff9a51" stroke-width="1.8"/><text x="438" y="44.0" font-size="14.5" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="700">② 손실 계산</text><text x="438" y="74.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">loss = loss_fn(pred, y)</text><text x="438" y="100.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">정답과 얼마나 틀렸나</text><rect x="420" y="186" width="300" height="100" rx="12" fill="#1d2223" fill-opacity="1" stroke="#ff8fcf" stroke-width="1.8"/><text x="438" y="210.0" font-size="14.5" fill="#ff8fcf" text-anchor="start" dominant-baseline="central" font-weight="700">③ 역전파</text><text x="438" y="240.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">loss.backward()</text><text x="438" y="266.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">가중치마다 고칠 방향(기울기)</text><rect x="30" y="186" width="300" height="100" rx="12" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.8"/><text x="48" y="210.0" font-size="14.5" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">④ 업데이트</text><text x="48" y="240.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">optimizer.step()</text><text x="48" y="266.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">기울기 반대로 조금 고치기</text><line x1="334" y1="70" x2="414" y2="70" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><line x1="570" y1="124" x2="570" y2="182" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><line x1="416" y1="236" x2="336" y2="236" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><line x1="180" y1="182" x2="180" y2="124" stroke="#c8ff3d" stroke-width="1.8" marker-end="url(#aha)"/><text x="375" y="144.9" font-size="12.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="600">데이터 묶음(배치)마다</text><text x="375" y="161.1" font-size="12.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="600">이 네 단계를 수천 번 반복</text><text x="375" y="308.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">optimizer.zero_grad()  ← 매번 ③ 전에 지난 기울기 지우기</text></svg>