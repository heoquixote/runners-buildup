<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 304" width="750" height="304" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>pandas와 seaborn도 matplotlib으로 그린다</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="30" y="14" width="200" height="58" rx="10" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="130" y="34.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">plt.plot(x, y)</text><text x="130" y="56.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">직접 그리기</text><line x1="130" y1="76" x2="180.0" y2="110" stroke="#a1aaa5" stroke-width="1.5" marker-end="url(#ah)"/><rect x="260" y="14" width="200" height="58" rx="10" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="360" y="34.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">df.plot()</text><text x="360" y="56.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">pandas가 대신 호출</text><line x1="360" y1="76" x2="352.5" y2="110" stroke="#a1aaa5" stroke-width="1.5" marker-end="url(#ah)"/><rect x="490" y="14" width="200" height="58" rx="10" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="590" y="34.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">sns.barplot(...)</text><text x="590" y="56.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">seaborn이 대신 호출</text><line x1="590" y1="76" x2="525.0" y2="110" stroke="#a1aaa5" stroke-width="1.5" marker-end="url(#ah)"/><rect x="160" y="114" width="380" height="150" rx="12" fill="#c8ff3d" fill-opacity="0.08" stroke="#c8ff3d" stroke-width="2"/><text x="180" y="136.0" font-size="16" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">matplotlib</text><rect x="190" y="152" width="320" height="100" rx="6" fill="#1d2223" fill-opacity="1" stroke="#c9cfcb" stroke-width="1.4"/><text x="200" y="166.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="600">Figure (도화지)</text><rect x="204" y="178" width="140" height="66" rx="4" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.4"/><text x="212" y="190.0" font-size="11" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="600">Axes (그래프 칸)</text><path d="M216,234 L249,214 L282,222 L330,200" fill="none" stroke="#66dbff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="356" y="178" width="140" height="66" rx="4" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.4"/><text x="364" y="190.0" font-size="11" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="600">Axes (그래프 칸)</text><rect x="374" y="214" width="18" height="24" rx="1" fill="#66dbff" fill-opacity="0.5" stroke="#66dbff" stroke-width="1"/><rect x="402" y="200" width="18" height="38" rx="1" fill="#66dbff" fill-opacity="0.5" stroke="#66dbff" stroke-width="1"/><rect x="430" y="220" width="18" height="18" rx="1" fill="#66dbff" fill-opacity="0.5" stroke="#66dbff" stroke-width="1"/><rect x="458" y="208" width="18" height="30" rx="1" fill="#66dbff" fill-opacity="0.5" stroke="#66dbff" stroke-width="1"/><line x1="544" y1="170" x2="600" y