t-size="12.5" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">.to('cuda')</text><text x="646" y="96.5" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">GPU로 옮겨</text><text x="646" y="111.5" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">수천 개 곱셈을 동시에</text><rect x="556" y="132" width="180" height="30" rx="15.0" fill="#ff8fcf" fill-opacity="0.14" stroke="#ff8fcf" stroke-width="1.4"/><text x="646.0" y="147.0" font-size="12" fill="#ff8fcf" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">requires_grad=True</text><text x="646" y="172.5" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">계산 과정을 기록했다가</text><text x="646" y="187.5" font-size="11.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">기울기를 자동으로</text><text x="545" y="228.0" font-size="13.5" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">텐서 = 배열 + GPU + 계산 기록</text></svg>