<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>같은 산점도를 matplotlib과 seaborn으로 그리기</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="10" y="10" width="300" height="230" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="26" y="32.0" font-size="14" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="700">matplotlib — 내가 직접</text><text x="26" y="60.0" font-size="11.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">fig, ax = plt.subplots()</text><text x="26" y="82.0" font-size="11.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">for sex, g in df.groupby('sex'):</text><text x="26" y="104.0" font-size="11.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">    ax.scatter(g['total_bill'],</text><text x="26" y="126.0" font-size="11.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">               g['tip'], label=sex)</text><text x="26" y="148.0" font-size="11.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">ax.set_xlabel('total_bill')</text><text x="26" y="170.0" font-size="11.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">ax.set_ylabel('tip')</text><text x="26" y="192.0" font-size="11.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">ax.legend(title='sex')</text><text x="26" y="222.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">묶기 · 반복 · 축 이름 · 범례를 하나하나</text><rect x="470" y="10" width="300" height="230" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="486" y="32.0" font-size="14" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">seaborn — 열 이름만 배정</text><text x="486" y="60.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">sns.scatterplot(</text><text x="486" y="82.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">    data=df,</text><text x="486" y="104.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">    x='total_bill',</text><text x="486" y="126.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">    y='tip',</text><text x="486" y="148.0" font-size="12" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">    hue='sex')</text><text x="486" y="222.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">묶기 · 색 · 범례 · 축 이름은 알아서</text><rect x="330" y="60" width="120" height="120" rx="6" f