<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" width="760" height="284" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>scikit-learn 모델의 공통 사용법 fit, predict, score</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="12" y="10" width="232" height="234" rx="14" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="128.0" y="34.0" font-size="15" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">결정트리</text><text x="128.0" y="56.0" font-size="11.5" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">DecisionTreeClassifier()</text><rect x="34" y="80" width="132" height="38" rx="19.0" fill="#c8ff3d" fill-opacity="0.14" stroke="#c8ff3d" stroke-width="1.4"/><text x="100.0" y="99.0" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">fit(X, y)</text><text x="184" y="99.0" font-size="13" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">학습</text><rect x="34" y="132" width="132" height="38" rx="19.0" fill="#66dbff" fill-opacity="0.14" stroke="#66dbff" stroke-width="1.4"/><text x="100.0" y="151.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">predict(X)</text><text x="184" y="151.0" font-size="13" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700">예측</text><rect x="34" y="184" width="132" height="38" rx="19.0" fill="#ff9a51" fill-opacity="0.14" stroke="#ff9a51" stroke-width="1.4"/><text x="100.0" y="203.0" font-size="13" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">score(X, y)</text><text x="184" y="203.0" font-size="13" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="700">채점</text><rect x="256" y="10" width="232" height="234" rx="14" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="372.0" y="34.0" font-size="15" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">로지스틱 회귀</text><text x="372.0" y="56.0" font-size="11.5" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">LogisticRegression()</text><rect x="278" y="80" width="132" height="38" rx="19.0" fill="#c8ff3d" fill-opacity="0.14" stroke="#c8ff3d" stroke-width="1.4"/><text x="344.0" y="99.0" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">fit(X, y)</text><text x="428" y="99.0" font-size="13" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">학습</text><rect x="278" y="132" width="132" height="38" rx="19.0" fill="#66dbff" fill-opacity="0.14" stroke="#66dbff" stroke-width="1.4"/><text x="344.0" y="151.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">predict(X)</text><text x="428" y="151.0" font-size="13" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700">예측</text><rect x="278" y="184" width="132" height="38" rx="19.0" fill="#ff9a51" fill-opacity="0.14" stroke="#ff9a51" stroke-width="1.4"/><text x="344.0" y="203.0" font-size="13" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">score(X, y)</text><text x="428" y="203.0" font-size="13" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="700">채점</text><rect x="500" y="10" width="232" height="234" rx="14" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="616.0" y="34.0" font-size="15" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">KNN</text><text x="616.0" y="56.0" font-size="11.5" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">KNeighborsClassifier()</text><rect x="522" y="80" width="132" height="38" rx="19.0" fill="#c8ff3d" fill-opacity="0.14" stroke="#c8ff3d" stroke-width="1.4"/><text x="588.0" y="99.0" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">fit(X, y)</text><text x="672" y="99.0" font-size="13" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">학습</text><rect x="522" y="132" width="132" height="38" rx="19.0" fill="#66dbff" fill-opacity="0.14" stroke="#66dbff" stroke-width="1.4"/><text x="588.0" y="151.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">predict(X)</text><text x="672" y="151.0" font-size="13" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700">예측</text><rect x="522" y="184" width="132" height="38" rx="19.0" fill="#ff9a51" fill-opacity="0.14" stroke="#ff9a51" stroke-width="1.4"/><text x="588.0" y="203.0" font-size="13" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">score(X, y)</text><text x=