<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 266" width="800" height="266" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>datetime 모듈의 네 가지 타입</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="10" y="10" width="390" height="100" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><rect x="10" y="10" width="6" height="100" rx="2" fill="#61db9c" fill-opacity="1" stroke="#61db9c" stroke-width="1.2"/><text x="32" y="34.0" font-size="16" fill="#61db9c" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">date</text><text x="88" y="34.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">달력의 한 칸</text><text x="32" y="64.0" font-size="12.5" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">date(2026, 11, 7)</text><text x="32" y="90.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">→ 2026-11-07</text><rect x="410" y="10" width="390" height="100" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><rect x="410" y="10" width="6" height="100" rx="2" fill="#66dbff" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="432" y="34.0" font-size="16" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">time</text><text x="488" y="34.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">시계의 한 순간</text><text x="432" y="64.0" font-size="12.5" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">time(9, 30)</text><text x="432" y="90.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">→ 09:30:00</text><rect x="10" y="122" width="390" height="100" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><rect x="10" y="122" width="6" height="100" rx="2" fill="#c8ff3d" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="32" y="146.0" font-size="16" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">datetime</text><text x="128" y="146.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">달력 + 시계</text><text x="32" y="176.0" font-size="12.5" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">datetime(2026, 11, 7, 9, 30)</text><text x="32" y="202.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">→ 2026-11-07 09:30:00</text><rect x="410" y="122" width="390" height="100" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><rect x="410" y="122" width="6" height="100" rx="2" fill="#ff9a51" fill-opacity="1" stroke="#ff9a51" stroke-width="1.2"/><text x="432" y="146.0" font-size="16" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">timedelta</text><text x="538" y="146.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">스톱워치 · 간격</text><text x="432" y="176.0" font-size="12.5" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">timedelta(days=1, hours=3)</text><text x="432" y="202.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">→ 1 day, 3:00:00</text><text x="205" y="246.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">datetime ± timedelta → datetime</text><text x="605" y="246.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">datetime − datetime → timedelta</text></svg>