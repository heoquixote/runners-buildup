<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 302" width="840" height="302" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>a.rate()는 Lot.rate(a)로 실행되어 a가 self 자리에 들어간다</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="10" y="10" width="820" height="70" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="30" y="30.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="600">우리가 쓰는 모양</text><text x="240" y="54.0" font-size="22" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">a</text><text x="253.2" y="54.0" font-size="22" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">.rate()</text><text x="560" y="54.0" font-size="13" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">점 앞의 객체가</text><rect x="10" y="100" width="820" height="84" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><path d="M246.6,70 C 246.6,110 381.8,100 381.8,134" fill="none" stroke="#66dbff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><line x1="381.8" y1="128" x2="381.8" y2="140" stroke="#66dbff" stroke-width="1.8" marker-end="url(#ah)"/><text x="30" y="120.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="600">파이썬이 실제로 실행하는 모양</text><text x="240" y="158.0" font-size="22" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">Lot.rate(</text><rect x="364.8" y="142" width="34" height="34" rx="6" fill="#66dbff" fill-opacity="0.15" stroke="#66dbff" stroke-width="1.6"/><text x="381.8" y="159.0" font-size="22" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">a</text><text x="402.8" y="158.0" font-size="22" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">)</text><text x="560" y="158.0" font-size="13" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">self 자리에 들어간다</text><rect x="10" y="200" width="820" height="92" rx="10" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="30" y="237.6" font-size="13" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">def rate(self):</text><text x="30" y="254.4" font-size="13" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">    return round(self.defects / self.qty * 100, 2)</text><text x="560" y="236.0" font-size="12.5" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="600">self.qty     → a.qty     (1250)</text><text x="560" y="260.0" font-size="12.5" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="600">self.defects → a.defects (18)</text></svg>