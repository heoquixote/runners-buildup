<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>폴더 나무와 상대 경로, 절대 경로</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="10" y="10" width="360" height="250" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="30" y="34.0" font-size="15" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="700">폴더 나무</text><text x="30" y="64.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">/  (맨 꼭대기)</text><path d="M40,74 v22 h8" fill="none" stroke="#3d4344" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="96.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">tmp/</text><path d="M62,106 v22 h8" fill="none" stroke="#3d4344" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="128.0" font-size="12.5" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">rb-a1b2c3/   ← 지금 위치 (작업 폴더)</text><path d="M84,138 v22 h8" fill="none" stroke="#3d4344" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="160.0" font-size="12.5" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">logs/</text><path d="M106,170 v22 h8" fill="none" stroke="#3d4344" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="118" y="192.0" font-size="12.5" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">20261107/</text><path d="M128,202 v22 h8" fill="none" stroke="#3d4344" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="224.0" font-size="12.5" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">inspection.csv</text><rect x="390" y="10" width="400" height="118" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="410" y="34.0" font-size="14" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700">상대 경로 · 지금 위치에서 출발</text><text x="410" y="66.0" font-size="12.5" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">logs/20261107/inspection.csv</text><text x="410" y="98.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">짧다. 작업 폴더가 바뀌면 가리키는 곳도 바뀐다</text><rect x="390" y="142" width="400" height="118" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="410" y="166.0" font-size="14" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">절대 경로 · 맨 꼭대기(/)에서 출발</text><text x="410" y="190.2" font-size="12" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">/tmp/rb-a1b2c3/logs/20261107/</text><text x="410" y="205.8" font-size="12" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">inspection.csv</text><text x="410" y="240.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">어디서 실행해도 같은 곳. os.path.abspath()로 만든다</text></svg>