<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 382" width="840" height="382" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>def 줄의 별은 값을 모으고, 호출할 때의 별은 값을 푼다</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="10" y="10" width="820" height="150" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="30" y="34.0" font-size="15" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">정의할 때 (def 줄) · 모은다</text><text x="30" y="66.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">average(10.1, 9.8, 10.4)</text><rect x="40" y="101" width="58" height="30" rx="6" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.4"/><text x="69.0" y="116.0" font-size="12.5" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">10.1</text><rect x="110" y="101" width="58" height="30" rx="6" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.4"/><text x="139.0" y="116.0" font-size="12.5" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">9.8</text><rect x="180" y="101" width="58" height="30" rx="6" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.4"/><text x="209.0" y="116.0" font-size="12.5" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">10.4</text><line x1="254" y1="116" x2="402" y2="116" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><text x="410" y="66.0" font-size="13" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">def average(*values):</text><rect x="410" y="92" width="230" height="48" rx="8" fill="#c8ff3d" fill-opacity="0.08" stroke="#c8ff3d" stroke-width="1.6"/><text x="525" y="116.0" font-size="12.5" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">values = (10.1, 9.8, 10.4)</text><text x="660" y="106.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">튜플 하나로</text><text x="660" y="126.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">**kwargs는 딕셔너리로</text><rect x="10" y="172" width="820" height="200" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="30" y="196.0" font-size="15" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="700">호출할 때 · 푼다</text><text x="30" y="230.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">temps = [10.1, 9.8, 10.4]</text><text x="30" y="258.0" font-size="13.5" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">average(*temps)</text><line x1="170" y1="258" x2="296" y2="258" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="304" y="243" width="58" height="30" rx="6" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.4"/><text x="333.0" y="258.0" font-size="12.5" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">10.1</text><rect x="374" y="243" width="58" height="30" rx="6" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.4"/><text x="403.0" y="258.0" font-size="12.5" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">9.8</text><rect x="444" y="243" width="58" height="30" rx="6" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.4"/><text x="473.0" y="258.0" font-size="12.5" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">10.4</text><text x="520" y="258.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">= average(10.1, 9.8, 10.4)</text><text x="30" y="302.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">spec = {"low": 9.8, "high": 10.2}</text><text x="30" y="332.0" font-size="13.5" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">judge(10.1, **spec)</text><line x1="206" y1="332" x2="300" y2="332" stroke="#a1aaa5" stroke-width="1.4" marker-end="url(#ah)"/><rect x="304" y="317" width="100" height="30" rx="6" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.4"/><text x="354.0" y="332.0" font-size="12.5" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">low=9.8</text><rect x="414" y="317" width="110" height="30" rx="6" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.4"/><text x="469.0" y="332.0" font-size="12.5" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">high=10.2</text><text x="540" y="332.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">= judge(10.1, low=9.8, high=10.2)</text></svg>