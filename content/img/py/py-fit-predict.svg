<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 228" width="840" height="228" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>모델 객체의 상태가 만들기, fit, predict 단계에서 어떻게 바뀌는가</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><text x="140.0" y="18.0" font-size="15" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="700">① 만들기</text><text x="140.0" y="46.0" font-size="12" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">model = MeanModel()</text><rect x="10" y="66" width="260" height="120" rx="12" fill="#121516" fill-opacity="1" stroke="#a1aaa5" stroke-width="1.6"/><text x="26" y="86.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="600">model 객체</text><rect x="34" y="102" width="212" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#a1aaa5" stroke-width="1.3"/><text x="140.0" y="122.0" font-size="13.5" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">mean_ = None</text><text x="140.0" y="166.0" font-size="12.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">아직 아무것도 모른다</text><line x1="273" y1="126" x2="287" y2="126" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><text x="420.0" y="18.0" font-size="15" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">② 배우기</text><text x="420.0" y="46.0" font-size="10.5" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">model.fit([10.1, 9.8, 10.4, 10.3])</text><rect x="290" y="66" width="260" height="120" rx="12" fill="#121516" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.6"/><text x="306" y="86.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="600">model 객체</text><rect x="314" y="102" width="212" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.3"/><text x="420.0" y="122.0" font-size="13.5" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">mean_ = 10.15</text><text x="420.0" y="166.0" font-size="12.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">배운 결과를 속성에 저장</text><line x1="553" y1="126" x2="567" y2="126" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><text x="700.0" y="18.0" font-size="15" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="700">③ 답하기</text><text x="700.0" y="46.0" font-size="10.5" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">model.predict(["new1", "new2"])</text><rect x="570" y="66" width="260" height="120" rx="12" fill="#121516" fill-opacity="1" stroke="#ff9a51" stroke-width="1.6"/><text x="586" y="86.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="600">model 객체</text><rect x="594" y="102" width="212" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#ff9a51" stroke-width="1.3"/><text x="700.0" y="122.0" font-size="13.5" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">mean_ = 10.15</text><text x="700.0" y="166.0" font-size="12.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">→ [10.15, 10.15]</text><text x="420" y="212.0" font-size="12.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">fit은 결과를 객체 안에 남기고, predict는 그 값을 꺼내 쓴다. 끝의 밑줄(_) = fit으로 생긴 값</text></svg>