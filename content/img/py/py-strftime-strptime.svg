<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 196" width="800" height="196" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>strftime과 strptime의 방향</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="10" y="40" width="210" height="110" rx="12" fill="#c8ff3d" fill-opacity="0.08" stroke="#c8ff3d" stroke-width="1.8"/><text x="115" y="70.0" font-size="16" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">datetime</text><text x="115" y="96.0" font-size="12.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">계산 · 비교 가능</text><text x="115" y="124.0" font-size="12" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">2026-11-07 09:00:00</text><rect x="580" y="40" width="210" height="110" rx="12" fill="#1d2223" fill-opacity="1" stroke="#ff9a51" stroke-width="1.6"/><text x="685" y="70.0" font-size="16" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="700">str (문자열)</text><text x="685" y="96.0" font-size="12.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">보기 · 저장용, 계산 불가</text><text x="685" y="124.0" font-size="12" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">'2026-11-07 09:00'</text><line x1="230" y1="70" x2="570" y2="70" stroke="#c8ff3d" stroke-width="2" marker-end="url(#aha)"/><text x="400" y="52.0" font-size="12.5" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">strftime("%Y-%m-%d %H:%M")</text><text x="400" y="86.0" font-size="11.5" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">f = format, 날짜 → 글자</text><line x1="570" y1="124" x2="230" y2="124" stroke="#a1aaa5" stroke-width="2" marker-end="url(#ah)"/><text x="400" y="108.0" font-size="12.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">datetime.strptime(s, "%Y-%m-%d %H:%M")</text><text x="400" y="142.0" font-size="11.5" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">p = parse, 글자 → 날짜</text><text x="400" y="178.0" font-size="12.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">두 방향 모두 같은 포맷 코드(%Y %m %d %H %M %S)를 쓴다</text></svg>