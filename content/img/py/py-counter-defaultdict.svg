<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 406" width="840" height="406" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>Counter는 세기를, defaultdict는 그룹별로 모으기를 짧게 해 준다</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><text x="20" y="20.0" font-size="15" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">세기</text><rect x="10" y="34" width="400" height="150" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="26" y="54.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="600">일반 딕셔너리</text><text x="26" y="87.8" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">counts = {}</text><text x="26" y="104.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">for d in defects:</text><text x="26" y="120.2" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">    counts[d] = counts.get(d, 0) + 1</text><text x="26" y="162.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">4줄 · 빈 상태에서 하나씩 더한다</text><rect x="430" y="34" width="400" height="150" rx="10" fill="#c8ff3d" fill-opacity="0.07" stroke="#c8ff3d" stroke-width="1.6"/><text x="446" y="54.0" font-size="12.5" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">Counter</text><text x="446" y="94.0" font-size="13" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">counts = Counter(defects)</text><text x="446" y="132.0" font-size="12.5" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">scratch 3 · dent 2 · crack 1</text><text x="446" y="162.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">1줄 · 없는 값은 0, most_common(n)</text><text x="20" y="212.0" font-size="15" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700">묶기</text><rect x="10" y="226" width="400" height="170" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="26" y="246.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="600">일반 딕셔너리</text><text x="26" y="275.6" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">for line, v in records:</text><text x="26" y="291.9" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">    if line not in groups:</text><text x="26" y="308.1" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">        groups[line] = []</text><text x="26" y="324.4" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">    groups[line].append(v)</text><text x="26" y="372.0" font-size="12" fill="#ff7a92" text-anchor="start" dominant-baseline="central" font-weight="500">if를 빼먹으면 KeyError</text><rect x="430" y="226" width="400" height="170" rx="10" fill="#66dbff" fill-opacity="0.07" stroke="#66dbff" stroke-width="1.6"/><text x="446" y="246.0" font-size="12.5" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">defaultdict(list)</text><text x="446" y="275.9" font-size="12.5" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">for line, v in records:</text><text x="446" y="292.1" font-size="12.5" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">    groups[line].append(v)</text><text x="446" y="321.9" font-size="12.5" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">A: [10.1, 9.8, 10.4]</text><text x="446" y="338.1" font-size="12.5" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">B: [10.6, 10.9]</text><text x="446" y="372.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">없는 key를 꺼내면 빈 리스트부터 만든다</text></svg>