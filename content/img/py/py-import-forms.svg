<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" width="860" height="290" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>import 문의 네 가지 모양과 쓰는 법</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><text x="20" y="20.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="600">불러오는 줄</text><text x="300" y="20.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="600">쓰는 법</text><text x="500" y="20.0" font-size="12.5" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="600">특징</text><rect x="10" y="38" width="840" height="52" rx="8" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><rect x="10" y="38" width="6" height="52" rx="2" fill="#c8ff3d" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="28" y="64.0" font-size="13.5" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">import math</text><line x1="258" y1="64" x2="286" y2="64" stroke="#a1aaa5" stroke-width="1.5" marker-end="url(#ah)"/><text x="300" y="64.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">math.sqrt(25)</text><text x="500" y="64.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">모듈 이름을 붙여 부른다. 어디서 온 함수인지 바로 보인다</text><rect x="10" y="100" width="840" height="52" rx="8" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><rect x="10" y="100" width="6" height="52" rx="2" fill="#66dbff" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="28" y="126.0" font-size="13.5" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">from math import sqrt</text><line x1="258" y1="126" x2="286" y2="126" stroke="#a1aaa5" stroke-width="1.5" marker-end="url(#ah)"/><text x="300" y="126.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">sqrt(25)</text><text x="500" y="126.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">꺼낸 이름만 바로 쓴다. 짧지만 출처가 안 보인다</text><rect x="10" y="162" width="840" height="52" rx="8" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><rect x="10" y="162" width="6" height="52" rx="2" fill="#a896ff" fill-opacity="1" stroke="#a896ff" stroke-width="1.2"/><text x="28" y="188.0" font-size="13.5" fill="#a896ff" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">import numpy as np</text><line x1="258" y1="188" x2="286" y2="188" stroke="#a1aaa5" stroke-width="1.5" marker-end="url(#ah)"/><text x="300" y="188.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">np.array([1, 2])</text><text x="500" y="188.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">긴 이름에 별명을 붙인다. np · pd는 모두가 쓰는 관례</text><rect x="10" y="224" width="840" height="52" rx="8" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><rect x="10" y="224" width="6" height="52" rx="2" fill="#ff7a92" fill-opacity="1" stroke="#ff7a92" stroke-width="1.2"/><text x="28" y="250.0" font-size="13.5" fill="#ff7a92" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">from math import *</text><line x1="258" y1="250" x2="286" y2="250" stroke="#a1aaa5" stroke-width="1.5" marker-end="url(#ah)"/><text x="300" y="250.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">sqrt(25)  ceil(4.1) …</text><text x="500" y="250.0" font-size="12.5" fill="#ff7a92" text-anchor="start" dominant-baseline="central" font-weight="500">전부 꺼낸다. 내 변수와 이름이 겹칠 수 있어 쓰지 않는다</text></svg>