<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 296" width="840" height="296" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>객체는 속성(가진 값)과 메서드(할 수 있는 일)를 함께 가진다</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><text x="20" y="22.0" font-size="13" fill="#f5f7f2" text-anchor="start" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">made = datetime(2026, 11, 7, 9, 30)</text><rect x="10" y="44" width="820" height="210" rx="12" fill="#121516" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.6"/><text x="30" y="66.0" font-size="14" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">made  ·  datetime 객체</text><rect x="30" y="84" width="370" height="154" rx="10" fill="#1d2223" fill-opacity="1" stroke="#61db9c" stroke-width="1.3"/><text x="46" y="104.0" font-size="13" fill="#61db9c" text-anchor="start" dominant-baseline="central" font-weight="700">속성 · 가진 값 (괄호 없음)</text><text x="52" y="134.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">made.year</text><rect x="220" y="124" width="70" height="22" rx="5" fill="#121516" fill-opacity="1" stroke="#61db9c" stroke-width="1.1"/><text x="255" y="135.0" font-size="12.5" fill="#61db9c" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">2026</text><text x="52" y="161.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">made.month</text><rect x="220" y="151" width="70" height="22" rx="5" fill="#121516" fill-opacity="1" stroke="#61db9c" stroke-width="1.1"/><text x="255" y="162.0" font-size="12.5" fill="#61db9c" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">11</text><text x="52" y="188.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">made.day</text><rect x="220" y="178" width="70" height="22" rx="5" fill="#121516" fill-opacity="1" stroke="#61db9c" stroke-width="1.1"/><text x="255" y="189.0" font-size="12.5" fill="#61db9c" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">7</text><text x="52" y="215.0" font-size="12.5" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">made.hour</text><rect x="220" y="205" width="70" height="22" rx="5" fill="#121516" fill-opacity="1" stroke="#61db9c" stroke-width="1.1"/><text x="255" y="216.0" font-size="12.5" fill="#61db9c" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">9</text><rect x="420" y="84" width="390" height="154" rx="10" fill="#1d2223" fill-opacity="1" stroke="#ff9a51" stroke-width="1.3"/><text x="436" y="104.0" font-size="13" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="700">메서드 · 할 수 있는 일 (괄호 있음)</text><rect x="436" y="124" width="200" height="26" rx="13" fill="#ff9a51" fill-opacity="0.12" stroke="#ff9a51" stroke-width="1.3"/><text x="536" y="137.0" font-size="11.5" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">weekday()</text><text x="648" y="137.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">→ 5</text><rect x="436" y="160" width="200" height="26" rx="13" fill="#ff9a51" fill-opacity="0.12" stroke="#ff9a51" stroke-width="1.3"/><text x="536" y="173.0" font-size="11.5" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">strftime("%Y-%m-%d")</text><text x="648" y="173.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">→ '2026-11-07'</text><rect x="436" y="196" width="200" height="26" rx="13" fill="#ff9a51" fill-opacity="0.12" stroke="#ff9a51" stroke-width="1.3"/><text x="536" y="209.0" font-size="11.5" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, monospace">replace(hour=10)</text><text x="648" y="209.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">→ 새 datetime</text><text x="420" y="276.0" font-size="13" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">made.year 처럼 이름만 쓰면 값을 꺼내고,  made.weekday() 처럼 괄호를 붙이면 일을 시킨다</text></svg>