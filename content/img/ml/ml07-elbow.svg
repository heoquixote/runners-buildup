<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>엘보 방법: inertia가 꺾이는 k 찾기</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><line x1="60" y1="250" x2="600" y2="250" stroke="#3d4344" stroke-width="1.4"/><line x1="60" y1="40" x2="60" y2="250" stroke="#3d4344" stroke-width="1.4"/><text x="330" y="286.0" font-size="13" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">k (그룹 수)</text><text x="66" y="28.0" font-size="13" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">inertia</text><path d="M80,50.0 L180,165.1 L280,200.7 L380,212.0 L480,219.5 L580,224.0" fill="none" stroke="#66dbff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80.0" cy="50.0" r="6" fill="#66dbff" fill-opacity="1" stroke="none" stroke-width="2"/><text x="80" y="266.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">1</text><circle cx="180.0" cy="165.1" r="6" fill="#66dbff" fill-opacity="1" stroke="none" stroke-width="2"/><text x="180" y="266.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">2</text><circle cx="280.0" cy="200.7" r="6" fill="#c8ff3d" fill-opacity="1" stroke="#f5f7f2" stroke-width="2"/><text x="280" y="266.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">3</text><circle cx="380.0" cy="212.0" r="6" fill="#66dbff" fill-opacity="1" stroke="none" stroke-width="2"/><text x="380" y="266.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">4</text><circle cx="480.0" cy="219.5" r="6" fill="#66dbff" fill-opacity="1" stroke="none" stroke-width="2"/><text x="480" y="266.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">5</text><circle cx="580.0" cy="224.0" r="6" fill="#66dbff" fill-opacity="1" stroke="none" stroke-width="2"/><text x="580" y="266.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">6</text><text x="294" y="130.2" font-size="13" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">엘보(팔꿈치): 여기부터</text><text x="294" y="147.1" font-size="13" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">줄어드는 폭이 확 작아짐</text><text x="144.0" y="110.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">크게 줄어듦</text><text x="470" y="189.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">조금씩만 줄어듦</text></svg>