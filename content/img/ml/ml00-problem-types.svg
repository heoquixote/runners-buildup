<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" width="760" height="284" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>머신러닝 문제의 종류</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="300" y="14" width="160" height="44" rx="8" fill="#121516" fill-opacity="1" stroke="#c9cfcb" stroke-width="1.2"/><text x="380.0" y="36.0" font-size="15" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">머신러닝 문제</text><path d="M340,58 L195,96" fill="none" stroke="#a1aaa5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M420,58 L565,96" fill="none" stroke="#a1aaa5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="105" y="96" width="180" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="195.0" y="111.9" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">지도 학습</text><text x="195.0" y="130.1" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">정답(y)이 있다</text><rect x="475" y="96" width="180" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="565.0" y="111.9" font-size="14" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">비지도 학습</text><text x="565.0" y="130.1" font-size="14" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">정답이 없다</text><path d="M160,146 L100,184" fill="none" stroke="#a1aaa5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M230,146 L290,184" fill="none" stroke="#a1aaa5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M530,146 L470,184" fill="none" stroke="#a1aaa5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,146 L660,184" fill="none" stroke="#a1aaa5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="184" width="160" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="100.0" y="204.0" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">회귀: 숫자 맞히기</text><text x="100" y="244.2" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">내일 매출, 공정 온도,</text><text x="100" y="259.8" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">집값</text><rect x="210" y="184" width="160" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="290.0" y="204.0" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">분류: 종류 맞히기</text><text x="290" y="244.2" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">생존/사망, 고장/정상,</text><text x="290" y="259.8" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">스팸/정상</text><rect x="390" y="184" width="160" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="470.0" y="204.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">군집: 비슷한 것 묶기</text><text x="470" y="244.2" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">고객 무리 나누기,</text><text x="470" y="259.8" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">운전 패턴 찾기</text><rect x="580" y="184" width="160" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="660.0" y="204.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">차원 축소: 요약</text><text x="660" y="244.2" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">열 13개 → 2개로</text><text x="660" y="259.8" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">그림 그리기</text></svg>