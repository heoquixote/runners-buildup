<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>인공지능, 머신러닝, 딥러닝의 포함 관계</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><ellipse cx="300" cy="170" rx="280" ry="150" fill="#a896ff" fill-opacity="0.10" stroke="#a896ff" stroke-width="1.6"/><ellipse cx="340" cy="190" rx="190" ry="105" fill="#66dbff" fill-opacity="0.12" stroke="#66dbff" stroke-width="1.6"/><ellipse cx="380" cy="212" rx="100" ry="56" fill="#c8ff3d" fill-opacity="0.16" stroke="#c8ff3d" stroke-width="1.6"/><text x="130" y="72.0" font-size="17" fill="#a896ff" text-anchor="middle" dominant-baseline="central" font-weight="700">인공지능 (AI)</text><text x="250" y="120.0" font-size="16" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">머신러닝 (ML)</text><text x="380" y="212.0" font-size="15" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">딥러닝 (DL)</text><text x="600" y="61.5" font-size="13" fill="#a896ff" text-anchor="start" dominant-baseline="central" font-weight="600">사람처럼 판단하는 프로그램 전부</text><text x="600" y="78.5" font-size="13" fill="#a896ff" text-anchor="start" dominant-baseline="central" font-weight="600">(규칙을 사람이 다 써 넣은 것도 포함)</text><text x="600" y="151.6" font-size="13" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="600">데이터를 보고 규칙을</text><text x="600" y="168.4" font-size="13" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="600">스스로 찾는 방법</text><text x="600" y="231.6" font-size="13" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="600">인공 신경망을 아주 깊게 쌓은</text><text x="600" y="248.4" font-size="13" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="600">머신러닝 (사진·음성·글)</text><line x1="560" y1="80" x2="590" y2="74" stroke="#a896ff" stroke-width="1.2"/><line x1="520" y1="170" x2="590" y2="162" stroke="#66dbff" stroke-width="1.2"/><line x1="478" y1="226" x2="590" y2="240" stroke="#c8ff3d" stroke-width="1.2"/></svg>