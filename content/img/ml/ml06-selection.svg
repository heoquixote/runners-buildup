<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 280" width="770" height="280" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>피처 셀렉션의 세 방식: Filter, Wrapper, Embedded</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="20" y="14" width="230" height="250" rx="10" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.4"/><text x="135" y="36.0" font-size="15" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">Filter (거르기)</text><rect x="270" y="14" width="230" height="250" rx="10" fill="#121516" fill-opacity="1" stroke="#ff9a51" stroke-width="1.4"/><text x="385" y="36.0" font-size="15" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="700">Wrapper (감싸기)</text><rect x="520" y="14" width="230" height="250" rx="10" fill="#121516" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.4"/><text x="635" y="36.0" font-size="15" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">Embedded (내장)</text><text x="36" y="70.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">열1</text><rect x="76" y="62" width="135.0" height="16" rx="3" fill="#66dbff" fill-opacity="0.85" stroke="none" stroke-width="1.2"/><text x="36" y="94.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">열2</text><rect x="76" y="86" width="122.99999999999999" height="16" rx="3" fill="#66dbff" fill-opacity="0.85" stroke="none" stroke-width="1.2"/><text x="36" y="118.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">열3</text><rect x="76" y="110" width="112.5" height="16" rx="3" fill="#66dbff" fill-opacity="0.85" stroke="none" stroke-width="1.2"/><text x="36" y="142.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">열4</text><rect x="76" y="134" width="60.0" height="16" rx="3" fill="#66dbff" fill-opacity="0.25" stroke="none" stroke-width="1.2"/><text x="36" y="166.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">열5</text><rect x="76" y="158" width="30.0" height="16" rx="3" fill="#66dbff" fill-opacity="0.25" stroke="none" stroke-width="1.2"/><text x="36" y="190.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">열6</text><rect x="76" y="182" width="15.0" height="16" rx="3" fill="#66dbff" fill-opacity="0.25" stroke="none" stroke-width="1.2"/><text x="135" y="214.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">열마다 정답과의 점수 → 상위 k개</text><text x="135" y="240.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">빠름 · 겹치는 열도 모두 뽑음</text><rect x="300" y="66" width="170" height="34" rx="8" fill="#1d2223" fill-opacity="1" stroke="#ff9a51" stroke-width="1.2"/><text x="385.0" y="83.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">모델 학습</text><rect x="300" y="128" width="170" height="34" rx="8" fill="#1d2223" fill-opacity="1" stroke="#ff9a51" stroke-width="1.2"/><text x="385.0" y="145.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">가장 약한 열 빼기</text><line x1="385" y1="100" x2="385" y2="126" stroke="#ff9a51" stroke-width="1.6" marker-end="url(#ah)"/><path d="M300,145 C268,145 268,83 298,83" fill="none" stroke="#ff9a51" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="385" y="180.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">원하는 개수가 될 때까지 반복</text><text x="385" y="214.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">예: RFE</text><text x="385" y="240.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">조합을 봄 · 여러 번 학습해 느림</text><text x="538" y="70.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">열1</text><rect x="580" y="62" width="120.0" height="16" rx="3" fill="#c8ff3d" fill-opacity="0.8" stroke="none" stroke-width="1.2"/><text x="538" y="96.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">열2</text><text x="590" y="96.0" font-size="12" fill="#ff7a92" text-anchor="start" dominant-baseline="central" font-weight="700">계수 0 → 탈락</text><text x="538" y="122.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">열3</text><rect x="580" y="114" width="75.0" height="16" rx="3" fill="#c8ff3d" fill-opacity="0.8" stroke="none" stroke-width="1.2"/><text x="538" y="148.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">열4</text><text x="590" y="148.0" font-size="12" fill="#ff7a92" text-anchor="start" dominant-baseline="central" font-weight="700">계수 0 → 탈락</text><text x="538" y="174.0" font-size="12" fill="#c9cfcb" text-anchor="start" dominant-baseline="central" font-weight="500">열5</text><rect x="580" y="166" width="45.0" height="16" rx="3" fill="#c8ff3d" fill-opacity="0.8" stroke="none" stroke-width="1.2"/><text x="635" y="214.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">학습하면서 모델이 스스로</text><text x="635" y="240.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">예: Lasso · 트리 중요도</text></svg>