<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 286" width="720" height="286" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>학습 단계와 예측 단계</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="10" y="10" width="700" height="130" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="30" y="34.0" font-size="15" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">① 학습 (fit) — 예전 기록으로 규칙 찾기</text><rect x="30" y="56" width="150" height="62" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="105.0" y="78.5" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">승객 기록 X</text><text x="105.0" y="95.5" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">(등급·성별·나이)</text><rect x="190" y="56" width="120" height="62" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="250.0" y="78.5" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">정답 y</text><text x="250.0" y="95.5" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">(생존 여부)</text><line x1="316" y1="87" x2="380" y2="87" stroke="#c8ff3d" stroke-width="2.2" marker-end="url(#aha)"/><rect x="386" y="52" width="150" height="70" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="461.0" y="77.9" font-size="14" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">모델</text><text x="461.0" y="96.1" font-size="14" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">(규칙이 담긴 상자)</text><text x="620" y="78.5" font-size="13" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">"여성이면 생존 쪽"</text><text x="620" y="95.5" font-size="13" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">"3등실이면 위험" …</text><rect x="10" y="156" width="700" height="120" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="30" y="180.0" font-size="15" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700">② 예측 (predict) — 처음 보는 사람에게 적용</text><rect x="30" y="200" width="200" height="58" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="130.0" y="220.6" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">새 승객 X</text><text x="130.0" y="237.4" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">(정답 모름)</text><line x1="236" y1="229" x2="380" y2="229" stroke="#66dbff" stroke-width="2.2" marker-end="url(#ah)"/><rect x="386" y="196" width="150" height="66" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="461.0" y="229.0" font-size="14" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">같은 모델</text><line x1="542" y1="229" x2="596" y2="229" stroke="#66dbff" stroke-width="2.2" marker-end="url(#ah)"/><rect x="600" y="204" width="96" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="648.0" y="220.6" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">생존 예측</text><text x="648.0" y="237.4" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="600">1 또는 0</text></svg>