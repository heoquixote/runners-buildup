<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 224" width="740" height="224" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>그래디언트 부스팅은 앞 트리들이 남긴 잔차를 다음 트리가 맞히며 차례로 쌓는다</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="20" y="20" width="200" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="120.0" y="45.0" font-size="15" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">트리 1</text><text x="120" y="92.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">y 를 대충 맞힘</text><rect x="50" y="112" width="140" height="22" rx="5" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><rect x="50" y="112" width="126.0" height="22" rx="5" fill="#ff9a51" fill-opacity="0.85" stroke="none" stroke-width="1.2"/><text x="120" y="150.0" font-size="12" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="600">남은 잔차 큼</text><line x1="224" y1="45" x2="266" y2="45" stroke="#c8ff3d" stroke-width="2" marker-end="url(#aha)"/><rect x="270" y="20" width="200" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="370.0" y="45.0" font-size="15" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">트리 2</text><text x="370" y="92.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">트리 1의 잔차를 맞힘</text><rect x="300" y="112" width="140" height="22" rx="5" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><rect x="300" y="112" width="63.0" height="22" rx="5" fill="#ff9a51" fill-opacity="0.85" stroke="none" stroke-width="1.2"/><text x="370" y="150.0" font-size="12" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="600">잔차 줄어듦</text><line x1="474" y1="45" x2="516" y2="45" stroke="#c8ff3d" stroke-width="2" marker-end="url(#aha)"/><rect x="520" y="20" width="200" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="620.0" y="45.0" font-size="15" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="600">트리 3</text><text x="620" y="92.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">트리 1+2의 잔차를 맞힘</text><rect x="550" y="112" width="140" height="22" rx="5" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><rect x="550" y="112" width="25.2" height="22" rx="5" fill="#ff9a51" fill-opacity="0.85" stroke="none" stroke-width="1.2"/><text x="620" y="150.0" font-size="12" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="600">잔차 더 줄어듦</text><rect x="20" y="172" width="700" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="370" y="192.0" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">최종 예측 = 기준값 + η × 트리1 + η × 트리2 + η × 트리3 + …   (η = learning_rate)</text></svg>