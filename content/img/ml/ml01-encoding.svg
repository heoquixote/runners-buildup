ospace">0</text><rect x="532" y="128" width="76" height="34" rx="0" fill="#c8ff3d" fill-opacity="0.22" stroke="#3d4344" stroke-width="1.2"/><text x="570.0" y="145.0" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">1</text><rect x="608" y="128" width="76" height="34" rx="0" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="646.0" y="145.0" font-size="14" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">0</text><rect x="380" y="162" width="76" height="34" rx="0" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="418.0" y="179.0" font-size="14" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">Q</text><rect x="456" y="162" width="76" height="34" rx="0" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="494.0" y="179.0" font-size="14" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">0</text><rect x="532" y="162" width="76" height="34" rx="0" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="570.0" y="179.0" font-size="14" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">0</text><rect x="608" y="162" width="76" height="34" rx="0" fill="#c8ff3d" fill-opacity="0.22" stroke="#3d4344" stroke-width="1.2"/><text x="646.0" y="179.0" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace">1</text><text x="535" y="225.0" font-size="13" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weig