<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>ACF는 모든 경로, PACF는 직접 경로</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="50" y="110" width="120" height="60" rx="12" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="110" y="130.0" font-size="15" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">그저께</text><text x="110" y="152.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">y(t−2)</text><rect x="300" y="110" width="120" height="60" rx="12" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="360" y="130.0" font-size="15" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">어제</text><text x="360" y="152.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">y(t−1)</text><rect x="550" y="110" width="120" height="60" rx="12" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="610" y="130.0" font-size="15" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">오늘</text><text x="610" y="152.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace">y(t)</text><line x1="174" y1="140" x2="296" y2="140" stroke="#a1aaa5" stroke-width="2" marker-end="url(#ah)"/><line x1="424" y1="140" x2="546" y2="140" stroke="#a1aaa5" stroke-width="2" marker-end="url(#ah)"/><text x="360" y="196.0" font-size="12.5" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">어제를 거쳐서 전해지는 영향 (건너서 온 소문)</text><path d="M110,106 C200,20 520,20 606,104" fill="none" stroke="#c8ff3d" stroke-width="2.4" marker-end="url(#aha)"/><text x="360" y="30.0" font-size="13" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">그저께가 오늘에 직접 주는 영향</text><rect x="60" y="222" width="290" height="50" rx="10" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.3"/><text x="205" y="238.0" font-size="14" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">ACF (래그 2)</text><text x="205" y="258.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">직접 경로 + 거쳐 온 경로 모두</text><rect x="370" y="222" width="290" height="50" rx="10" fill="#121516" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.3"/><text x="515" y="238.0" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">PACF (래그 2)</text><text x="515" y="258.0" font-size="12" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">어제의 몫을 빼고 직접 경로만</text></svg>