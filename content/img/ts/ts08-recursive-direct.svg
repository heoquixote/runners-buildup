<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>재귀 전략과 직접 전략</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="20" y="20" width="350" height="250" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="195.0" y="42.0" font-size="15" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">재귀 전략</text><text x="195.0" y="62.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">모델 하나를 반복해서 쓴다</text><rect x="40" y="76" width="110" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="95.0" y="94.0" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">모델</text><line x1="154" y1="94" x2="206" y2="94" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><rect x="210" y="76" width="130" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="275.0" y="94.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">내일 예측</text><path d="M275,114 C275,130 95,120 95,134" fill="none" stroke="#ffcf4a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/><rect x="40" y="136" width="110" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="95.0" y="154.0" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">모델</text><line x1="154" y1="154" x2="206" y2="154" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><rect x="210" y="136" width="130" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="275.0" y="154.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">모레 예측</text><path d="M275,174 C275,190 95,180 95,194" fill="none" stroke="#ffcf4a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/><rect x="40" y="196" width="110" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="95.0" y="214.0" font-size="14" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">모델</text><line x1="154" y1="214" x2="206" y2="214" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><rect x="210" y="196" width="130" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="275.0" y="214.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">글피 예측</text><text x="195" y="254.0" font-size="12" fill="#ffcf4a" text-anchor="middle" dominant-baseline="central" font-weight="500">예측값이 다시 입력으로 → 오차가 쌓일 수 있음</text><rect x="390" y="20" width="350" height="250" rx="10" fill="#121516" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="565.0" y="42.0" font-size="15" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">직접 전략</text><text x="565.0" y="62.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">지평마다 모델을 따로 둔다</text><rect x="410" y="76" width="110" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="465.0" y="94.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">모델 h=1</text><line x1="524" y1="94" x2="576" y2="94" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><rect x="580" y="76" width="130" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="645.0" y="94.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">1일 뒤 예측</text><rect x="410" y="136" width="110" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="465.0" y="154.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">모델 h=2</text><line x1="524" y1="154" x2="576" y2="154" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><rect x="580" y="136" width="130" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="645.0" y="154.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">2일 뒤 예측</text><rect x="410" y="196" width="110" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.2"/><text x="465.0" y="214.0" font-size="13" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">모델 h=7</text><line x1="524" y1="214" x2="576" y2="214" stroke="#a1aaa5" stroke-width="1.8" marker-end="url(#ah)"/><rect x="580" y="196" width="130" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="645.0" y="214.0" font-size="13" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="600">7일 뒤 예측</text><text x="565" y="254.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">오차가 쌓이지 않지만 모델을 여러 개 학습</text></svg>