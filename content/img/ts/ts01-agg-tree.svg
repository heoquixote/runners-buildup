<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>값의 종류에 따라 묶는 계산 고르기</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="250" y="16" width="240" height="40" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.2"/><text x="370.0" y="36.0" font-size="15" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">이 값은 어떤 종류인가?</text><line x1="310" y1="58" x2="120" y2="88" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="20" y="92" width="200" height="66" rx="10" fill="#121516" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.4"/><text x="120" y="114.0" font-size="15" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">쌓이는 양</text><text x="120" y="138.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">대여 건수 · 생산량 · 매출</text><line x1="120" y1="160" x2="120" y2="184" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30" y="188" width="180" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="120.0" y="206.0" font-size="13.5" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">합계  sum</text><line x1="370" y1="58" x2="360" y2="88" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="260" y="92" width="200" height="66" rx="10" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.4"/><text x="360" y="114.0" font-size="15" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">그 순간의 상태</text><text x="360" y="138.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">온도 · 압력 · 습도</text><line x1="360" y1="160" x2="360" y2="184" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="270" y="188" width="180" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="360.0" y="206.0" font-size="13.5" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">평균 mean · 최대 max</text><line x1="430" y1="58" x2="600" y2="88" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="500" y="92" width="200" height="66" rx="10" fill="#121516" fill-opacity="1" stroke="#ff9a51" stroke-width="1.4"/><text x="600" y="114.0" font-size="15" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="700">그 시점의 수준</text><text x="600" y="138.0" font-size="12" fill="#a1aaa5" text-anchor="middle" dominant-baseline="central" font-weight="500">재고 · 잔고 · 누적 카운터</text><line x1="600" y1="160" x2="600" y2="184" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="510" y="188" width="180" height="36" rx="8" fill="#1d2223" fill-opacity="1" stroke="#3d4344" stroke-width="1.2"/><text x="600.0" y="206.0" font-size="13.5" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">마지막 값  last</text></svg>