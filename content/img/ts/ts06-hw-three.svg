<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 288" width="750" height="288" role="img" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title>Holt-Winters의 세 가지 갱신</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1aaa5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ff3d"/></marker></defs><rect x="20" y="100" width="120" height="50" rx="8" fill="#1d2223" fill-opacity="1" stroke="#c9cfcb" stroke-width="1.2"/><text x="80.0" y="125.0" font-size="14" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="700">새 관측값</text><line x1="144" y1="125" x2="196" y2="54" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="200" y="24" width="270" height="60" rx="10" fill="#121516" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.4"/><text x="216" y="44.0" font-size="14.5" fill="#c8ff3d" text-anchor="start" dominant-baseline="central" font-weight="700">수준  level</text><text x="216" y="66.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">지금 높이는 어디쯤?</text><circle cx="440.0" cy="54.0" r="16" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.4"/><text x="440" y="54.0" font-size="15" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">α</text><line x1="474" y1="54" x2="546" y2="125" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><line x1="144" y1="125" x2="196" y2="132" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="200" y="102" width="270" height="60" rx="10" fill="#121516" fill-opacity="1" stroke="#66dbff" stroke-width="1.4"/><text x="216" y="122.0" font-size="14.5" fill="#66dbff" text-anchor="start" dominant-baseline="central" font-weight="700">추세  trend</text><text x="216" y="144.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">한 칸에 얼마나 오르나?</text><circle cx="440.0" cy="132.0" r="16" fill="#1d2223" fill-opacity="1" stroke="#66dbff" stroke-width="1.4"/><text x="440" y="132.0" font-size="15" fill="#66dbff" text-anchor="middle" dominant-baseline="central" font-weight="700">β</text><line x1="474" y1="132" x2="546" y2="125" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><line x1="144" y1="125" x2="196" y2="210" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="200" y="180" width="270" height="60" rx="10" fill="#121516" fill-opacity="1" stroke="#ff9a51" stroke-width="1.4"/><text x="216" y="200.0" font-size="14.5" fill="#ff9a51" text-anchor="start" dominant-baseline="central" font-weight="700">계절  season</text><text x="216" y="222.0" font-size="12" fill="#a1aaa5" text-anchor="start" dominant-baseline="central" font-weight="500">이 달은 평소보다 얼마나?</text><circle cx="440.0" cy="210.0" r="16" fill="#1d2223" fill-opacity="1" stroke="#ff9a51" stroke-width="1.4"/><text x="440" y="210.0" font-size="15" fill="#ff9a51" text-anchor="middle" dominant-baseline="central" font-weight="700">γ</text><line x1="474" y1="210" x2="546" y2="125" stroke="#a1aaa5" stroke-width="1.6" marker-end="url(#ah)"/><rect x="550" y="88" width="180" height="74" rx="10" fill="#1d2223" fill-opacity="1" stroke="#c8ff3d" stroke-width="1.6"/><text x="640" y="110.0" font-size="15" fill="#c8ff3d" text-anchor="middle" dominant-baseline="central" font-weight="700">예측</text><text x="640" y="138.0" font-size="12.5" fill="#f5f7f2" text-anchor="middle" dominant-baseline="central" font-weight="500">수준 + h×추세 + 계절</text><text x="335" y="268.0" font-size="12.5" fill="#c9cfcb" text-anchor="middle" dominant-baseline="central" font-weight="500">α · β · γ 는 '새 값을 얼마나 믿고 고칠지'를 정하는 0~1 사이의 수</text></svg>