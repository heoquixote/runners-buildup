<text x="390" y="552" font-size="12" fill="#334155">두 방법을 합쳤습니다. 딥러닝의 기본 선택입니다</text>
<rect x="40" y="580" width="1120" height="64" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="600" y="606" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Adam이 언제나 최선은 아닙니다</text>
<text x="600" y="630" text-anchor="middle" font-size="12.5" fill="#334155">빠르게 좋은 지점에 도달하지만, 마지막 미세한 수렴에서는 잘 조정된 SGD와 모멘텀이 나은 경우가 보고되어 있습니다</text>
