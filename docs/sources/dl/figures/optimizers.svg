<text x="390" y="508" font-size="12" fill="#334155">갱신이 많던 것은 작게 — 다만 누적이 쌓여 학습이 멈춥니다</text>
<line x1="76" y1="515" x2="1124" y2="515" stroke="#e2e8f0" stroke-width="1"/>
