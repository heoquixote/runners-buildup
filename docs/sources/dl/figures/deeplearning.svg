<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect width="1200" height="690" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">딥러닝 알고리즘의 계보</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#64748b">각 알고리즘은 앞선 구조가 다루지 못한 데이터를 만나면서 갈라졌습니다</text>

  <rect x="470" y="98" width="260" height="48" rx="10" fill="#0f172a"/>
  <text x="600" y="129" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">은닉층을 깊게 쌓는다</text>
  <path d="M600 146 L600 170 M180 170 L1020 170 M180 170 L180 194 M600 170 L600 194 M1020 170 L1020 194" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="60" y="194" width="240" height="52" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="180" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">순서가 없는 데이터</text>
  <text x="180" y="238" text-anchor="middle" font-size="11" fill="#64748b">정형 · 이미지</text>
  <rect x="480" y="194" width="240" height="52" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="600" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">순서가 있는 데이터</text>
  <text x="600" y="238" text-anchor="middle" font-size="11" fill="#64748b">텍스트 · 음성 · 시계열</text>
  <rect x="900" y="194" width="240" height="52" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="1020" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">정답이 없는 데이터</text>
  <text x="1020" y="238" text-anchor="middle" font-size="11" fill="#64748b">비지도 · 생성</text>

  <path d="M180 246 L180 268 M110 268 L250 268 M110 268 L110 290 M250 268 L250 290" fill="none" stroke="#cbd5e1" stroke-width="1.8"/>
  <rect x="46" y="290" width="128" height="92" rx="9" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">DNN</text>
  <text x="110" y="340" text-anchor="middle" font-size="11" fill="#334155">완전연결 층을</text>
  <text x="110" y="358" text-anchor="middle" font-size="11" fill="#334155">여러 겹 쌓음</text>
  <rect x="186" y="290" width="128" height="92" rx="9" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">CNN</text>
  <text x="250" y="340" text-anchor="middle" font-size="11" fill="#334155">필터를 이동시키며</text>
  <text x="250" y="358" text-anchor="middle" font-size="11" fill="#334155">지역 특징을 추출</text>

  <path d="M600 246 L600 268 M418 268 L782 268 M418 268 L418 290 M600 268 L600 290 M782 268 L782 290" fill="none" stroke="#cbd5e1" stroke-width="1.8"/>
  <rect x="354" y="290" width="128" height="92" rx="9" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="418" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">RNN</text>
  <text x="418" y="340" text-anchor="middle" font-size="11" fill="#334155">이전 시점 상태를</text>
  <text x="418" y="358" text-anchor="middle" font-size="11" fill="#334155">다음으로 넘김</text>
  <rect x="536" y="290" width="128" height="92" rx="9" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="600" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">LSTM · GRU</text>
  <text x="600" y="340" text-anchor="middle" font-size="11" fill="#334155">기억과 망각을</text>
  <text x="600" y="358" text-anchor="middle" font-size="11" fill="#334155">문으로 조절</text>
  <rect x="718" y="290" width="128" height="92" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="782" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">트랜스포머</text>
  <text x="782" y="340" text-anchor="middle" font-size="11" fill="#334155">어텐션으로 모든</text>
  <text x="782" y="358" text-anchor="middle" font-size="11" fill="#334155">위치를 한 번에 참조</text>
  <g stroke="#dc2626" stroke-width="2" fill="none">
    <path d="M486 336 L528 336"/><polygon points="532,336 522,331 522,341" fill="#dc2626" stroke="none"/>
    <path d="M668 336 L710 336"/><polygon points="714,336 704,331 704,341" fill="#dc2626" stroke="none"/>
  </g>

  <path d="M1020 246 L1020 268 M960 268 L1082 268 M960 268 L960 290 M1082 268 L1082 290" fill="none" stroke="#cbd5e1" stroke-width="1.8"/>
  <rect x="896" y="290" width="128" height="92" rx="9" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
  <text x="960" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">오토인코더</text>
  <text x="960" y="340" text-anchor="middle" font-size="11" fill="#334155">압축했다 복원하며</text>
  <text x="960" y="358" text-anchor="middle" font-size="11" fill="#334155">핵심 표현 학습</text>
  <rect x="1026" y="290" width="128" height="92" rx="9" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
  <text x="1090" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">GAN</text>
  <text x="1090" y="340" text-anchor="middle" font-size="11" fill="#334155">생성자와 판별자를</text>
  <text x="1090" y="358" text-anchor="middle" font-size="11" fill="#334155">경쟁시킴</text>

  <rect x="354" y="396" width="492" height="52" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="600" y="418" text-anchor="middle" font-size="12" fill="#991b1b"><tspan font-weight="700">RNN의 한계</tspan> 긴 순서에서 기울기가 소실됩니다 → 문으로 기억을 조절해 해결</text>
  <text x="600" y="438" text-anchor="middle" font-size="12" fill="#991b1b"><tspan font-weight="700">LSTM의 한계</tspan> 순차 처리라 병렬화가 안 됩니다 → 모든 위치를 동시에 참조해 해결</text>

  <rect x="40" y="470" width="1120" height="130" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8"/>
  <text x="600" y="500" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">깊이가 가능해진 세 가지 조건</text>
  <g font-size="12.5">
    <rect x="70" y="516" width="330" height="66" rx="9" fill="#eff6ff"/>
    <text x="235" y="542" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">데이터</text>
    <text x="235" y="566" text-anchor="middle" fill="#334155">학습할 값이 많아 대량이 필요합니다</text>
    <rect x="435" y="516" width="330" height="66" rx="9" fill="#ecfeff"/>
    <text x="600" y="542" text-anchor="middle" font-size="13.5" font-weight="700" fill="#164e63">연산 장치</text>
    <text x="600" y="566" text-anchor="middle" fill="#334155">GPU가 행렬 연산을 병렬 처리합니다</text>
    <rect x="800" y="516" width="330" height="66" rx="9" fill="#ecfdf5"/>
    <text x="965" y="542" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">학습 기법</text>
    <text x="965" y="566" text-anchor="middle" fill="#334155">ReLU · 드롭아웃 · 배치 정규화</text>
  </g>

  <rect x="40" y="618" width="1120" height="36" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="600" y="641" text-anchor="middle" font-size="12.5" fill="#92400e">표 형태의 정형 데이터에서는 부스팅 계열이 더 나은 경우가 많고, 설명이 필요한 영역에서는 단일 모델이 낫습니다</text>
</svg>
